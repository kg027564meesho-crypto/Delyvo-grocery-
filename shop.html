<main>

  <input id="password" type="password" placeholder="Password">

<div id="shopBox" style="display:none">
  <div class="card">
    <div class="row">
      <div>
        <h2 style="margin:0">Orders</h2>

    </div>

  <div id="orders"></div>
</div>

</main>

<script>
const SUPABASE_URL="https://unwdkreujyejgcucgttj.supabase.co";
const SUPABASE_KEY="sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

function token(){
  return localStorage.getItem("delyvo_shop_token");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const msg=document.getElementById("loginMsg");

  msg.textContent="Login ho raha hai...";

  const r=await fetch(
    SUPABASE_URL+"/auth/v1/token?grant_type=password",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        apikey:SUPABASE_KEY
      },
      body:JSON.stringify({email,password})
    }
  );

  const d=await r.json();

  if(!r.ok){
    msg.className="error";
    msg.textContent=d.msg||d.message||"Login failed";
    return;
  }

  localStorage.setItem("delyvo_shop_token",d.access_token);
  localStorage.setItem("delyvo_shop_refresh",d.refresh_token);

  await loadShop();
}

async function api(path,options={}){
  const headers={
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+token(),
    ...options.headers
  };

  return fetch(SUPABASE_URL+path,{...options,headers});
}

window.loadShopOrders = async function() {
  const tokenValue =
    localStorage.getItem("delyvo_shop_token") || "";

  if (!tokenValue) {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("shopBox").style.display = "none";
    return [];
  }

  try {
    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/orders" +
      "?select=id,order_number,status,payment_status,subtotal,delivery_fee,total,created_at,address_id," +
      "order_items(id,product_name,variant_name,quantity,unit_price,total)," +
      "addresses(recipient_name,phone,address_line1,address_line2,landmark,city,state,pincode)" +
      "&order=created_at.desc",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + tokenValue
        }
      }
    );

    const data = await response.json().catch(() => []);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.hint ||
        data?.details ||
        "Orders load nahi ho paye."
      );
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("shopBox").style.display = "block";

    const orders = Array.isArray(data) ? data : [];

    window.delyvoShopOrders = orders;
    window.shopOrders = orders;

    window.renderFinalShopOrders(orders);

    if (typeof window.addFinalShopOrderFilters === "function") {
      window.addFinalShopOrderFilters();
    }

    if (typeof window.filterFinalShopOrders === "function") {
      window.filterFinalShopOrders();
    }

    return orders;

  } catch (error) {
    console.error("DELYVO SHOP ORDERS ERROR:", error);

    const msg = document.getElementById("loginMsg");

    if (msg) {
      msg.className = "error";
      msg.textContent =
        error?.message ||
        "Orders load nahi ho paye.";
    }

    return [];
  }
};


async function loadShop() {
  return await window.loadShopOrders();
}


document.getElementById("login").onclick=login;
document.getElementById("refresh").onclick=loadShop;

document.getElementById("logoutBtn").onclick=()=>{
  localStorage.removeItem("delyvo_shop_token");
  localStorage.removeItem("delyvo_shop_refresh");
  location.reload();
};

if(token()) loadShop();
</script>

<script>
(() => {
  const DLV_SUPABASE_URL = "https://unwdkreujyejgcucgttj.supabase.co";
  const DLV_SUPABASE_KEY = "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

  function shopToken() {
    return localStorage.getItem("delyvo_shop_token") || "";
  }

  async function shopRequest(path, options = {}) {
    const response = await fetch(
      DLV_SUPABASE_URL + path,
      {
        ...options,
        headers: {
          apikey: DLV_SUPABASE_KEY,
          Authorization: "Bearer " + shopToken(),
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.msg ||
        data?.hint ||
        "Shop request failed"
      );
    }

    return data;
  }

  async function markShopOrderDelivered(orderId) {
    if (!orderId) return;

    if (!shopToken()) {
      alert("Shop login required.");
      return;
    }

    try {
      const deliveries = await shopRequest(
        "/rest/v1/deliveries" +
        "?select=id,status,order_id" +
        "&order_id=eq." + encodeURIComponent(orderId) +
        "&limit=1"
      );

      if (!deliveries || !deliveries.length) {
        throw new Error(
          "Delivery record nahi mila. Pehle order ko Out for Delivery karo."
        );
      }

      const delivery = deliveries[0];

      await shopRequest(
        "/rest/v1/deliveries?id=eq." +
        encodeURIComponent(delivery.id),
        {
          method: "PATCH",
          body: JSON.stringify({
            status: "delivered",
            delivered_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          })
        }
      );

      await shopRequest(
        "/rest/v1/rpc/transition_order_status",
        {
          method: "POST",
          body: JSON.stringify({
            p_order_id: orderId,
            p_new_status: "delivered"
          })
        }
      );

      alert("Order delivered successfully.");

      if (typeof window.loadShopOrders === "function") {
        await window.loadShopOrders();
      } else if (typeof window.loadOrders === "function") {
        await window.loadOrders();
      } else {
        location.reload();
      }

    } catch (error) {
      alert(error.message || "Order delivery update failed.");
    }
  }

  window.markShopOrderDelivered = markShopOrderDelivered;
})();
</script>


<script>
(() => {
  const DLV_URL = "https://unwdkreujyejgcucgttj.supabase.co";
  const DLV_KEY = "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

  function shopToken() {
    return localStorage.getItem("delyvo_shop_token") || "";
  }

  async function rejectShopOrder(orderId) {
    if (!orderId) return;

    if (!shopToken()) {
      alert("Shop login required.");
      return;
    }

    const ok = confirm(
      "Kya aap is order ko reject/cancel karna chahte ho?"
    );

    if (!ok) return;

    try {
      const response = await fetch(
        DLV_URL + "/rest/v1/rpc/transition_order_status",
        {
          method: "POST",
          headers: {
            apikey: DLV_KEY,
            Authorization: "Bearer " + shopToken(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            p_order_id: orderId,
            p_new_status: "cancelled"
          })
        }
      );

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(
          data?.message ||
          data?.msg ||
          data?.hint ||
          "Order reject failed"
        );
      }

      alert("Order rejected successfully.");

      if (typeof window.loadShopOrders === "function") {
        await window.loadShopOrders();
      } else if (typeof window.loadOrders === "function") {
        await window.loadOrders();
      } else {
        location.reload();
      }

    } catch (error) {
      alert(error.message || "Order reject failed.");
    }
  }

  window.rejectShopOrder = rejectShopOrder;
})();
</script>

<script>
(() => {
  function addOrderFilters() {
    const section =
      document.querySelector("#ordersSection") ||
      document.querySelector(".orders-section");

    if (!section) return;

    if (document.getElementById("shopOrderFilters")) return;

    const box = document.createElement("div");
    box.id = "shopOrderFilters";

    box.innerHTML = `
      <div class="sof-row">
        <input
          id="shopOrderSearch"
          type="search"
          placeholder="Search order number or customer..."
        >

        <select id="shopOrderStatusFilter">
          <option value="all">All Orders</option>
          <option value="placed">New</option>
          <option value="confirmed">Confirmed</option>
          <option value="packing">Packing</option>
          <option value="packed">Ready</option>
          <option value="out_for_delivery">Out for Delivery</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>
    `;

    section.prepend(box);

    document
      .getElementById("shopOrderSearch")
      .addEventListener("input", filterShopOrders);

    document
      .getElementById("shopOrderStatusFilter")
      .addEventListener("change", filterShopOrders);
  }

  function filterShopOrders() {
    const search =
      (
        document.getElementById("shopOrderSearch")?.value ||
        ""
      ).toLowerCase().trim();

    const status =
      document.getElementById("shopOrderStatusFilter")?.value ||
      "all";

    document.querySelectorAll(".shop-order-card").forEach(card => {
      const text = card.textContent.toLowerCase();

      const matchesSearch =
        !search || text.includes(search);

      const cardStatus =
        card.dataset.status || "";

      const matchesStatus =
        status === "all" ||
        cardStatus === status;

      card.style.display =
        matchesSearch && matchesStatus
          ? ""
          : "none";
    });
  }

  window.addShopOrderFilters = addOrderFilters;

  window.addEventListener("load", () => {
    setTimeout(addOrderFilters, 400);
  });

  const style = document.createElement("style");

  style.textContent = `
    #shopOrderFilters {
      margin:12px 0 18px;
    }

    .sof-row {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    #shopOrderSearch,
    #shopOrderStatusFilter {
      box-sizing:border-box;
      min-height:42px;
      padding:9px 12px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      font-size:14px;
    }

    #shopOrderSearch {
      flex:1;
      min-width:220px;
    }

    #shopOrderStatusFilter {
      min-width:170px;
    }

    @media(max-width:600px) {
      #shopOrderSearch,
      #shopOrderStatusFilter {
        width:100%;
        min-width:0;
      }
    }
  `;

  document.head.appendChild(style);
})();
</script>


<script>
(() => {
  function addProductFilters() {
    if (document.getElementById("shopProductFilters")) return;

    const productSection =
      document.querySelector("#productsSection") ||
      document.querySelector(".products-section");

    if (!productSection) return;

    const box = document.createElement("div");
    box.id = "shopProductFilters";

    box.innerHTML = `
      <div class="spf-row">
        <input
          id="shopProductSearch"
          type="search"
          placeholder="Search product..."
        >

        <select id="shopProductStatus">
          <option value="all">All Products</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
          <option value="low">Low Stock</option>
        </select>
      </div>
    `;

    productSection.prepend(box);

    document
      .getElementById("shopProductSearch")
      .addEventListener("input", filterShopProducts);

    document
      .getElementById("shopProductStatus")
      .addEventListener("change", filterShopProducts);
  }

  function filterShopProducts() {
    const search =
      (
        document.getElementById("shopProductSearch")?.value ||
        ""
      ).toLowerCase().trim();

    const status =
      document.getElementById("shopProductStatus")?.value ||
      "all";

    document.querySelectorAll(
      "#productsSection tbody tr, .products-section tbody tr"
    ).forEach(row => {
      const text = row.textContent.toLowerCase();

      const matchesSearch =
        !search || text.includes(search);

      const activeButton =
        row.querySelector(
          ".product-active-toggle, .variant-active-toggle"
        );

      const isActive =
        activeButton?.dataset.active !== "false";

      const stockText =
        row.querySelector(
          ".stock-input, input[name*='stock'], input[type='number']"
        )?.value;

      const stock =
        Number(stockText || 0);

      let matchesStatus = true;

      if (status === "active") {
        matchesStatus = isActive;
      }

      if (status === "inactive") {
        matchesStatus = !isActive;
      }

      if (status === "low") {
        matchesStatus = stock <= 5;
      }

      row.style.display =
        matchesSearch && matchesStatus
          ? ""
          : "none";
    });
  }

  window.addShopProductFilters = addProductFilters;

  window.addEventListener("load", () => {
    setTimeout(addProductFilters, 500);
  });

  const style = document.createElement("style");

  style.textContent = `
    #shopProductFilters {
      margin:12px 0 18px;
    }

    .spf-row {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    #shopProductSearch,
    #shopProductStatus {
      min-height:42px;
      padding:9px 12px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fff;
      font-size:14px;
      box-sizing:border-box;
    }

    #shopProductSearch {
      flex:1;
      min-width:220px;
    }

    #shopProductStatus {
      min-width:170px;
    }

    @media(max-width:600px) {
      #shopProductSearch,
      #shopProductStatus {
        width:100%;
        min-width:0;
      }
    }
  `;

  document.head.appendChild(style);
})();
</script>


<script>
(() => {
  let shopRefreshTimer = null;

  function startShopAutoRefresh() {
    if (shopRefreshTimer) {
      clearInterval(shopRefreshTimer);
    }

    shopRefreshTimer = setInterval(async () => {
      if (!localStorage.getItem("delyvo_shop_token")) {
        return;
      }

      try {
        if (typeof window.loadShopOrders === "function") {
          await window.loadShopOrders();
        } else if (typeof window.loadOrders === "function") {
          await window.loadOrders();
        }

        if (typeof window.loadFinalShopDashboard === "function") {
          await window.loadFinalShopDashboard();
        }
      } catch (error) {
        console.log("Shop auto refresh:", error.message);
      }
    }, 30000);
  }

  window.startShopAutoRefresh = startShopAutoRefresh;

  window.addEventListener("load", () => {
    setTimeout(startShopAutoRefresh, 1500);
  });

  const style = document.createElement("style");

  style.textContent = `
    .shop-refresh-info {
      margin:8px 0 14px;
      padding:8px 11px;
      border-radius:8px;
      background:#f5f5f5;
      color:#666;
      font-size:12px;
    }
  `;

  document.head.appendChild(style);

  const info = document.createElement("div");
  info.className = "shop-refresh-info";
  info.textContent = "Orders automatically refresh every 30 seconds.";

  const ordersSection =
    document.querySelector("#ordersSection") ||
    document.querySelector(".orders-section");

  if (ordersSection) {
    ordersSection.prepend(info);
  }
})();
</script>


<script>
/* =========================================================
   DELYVO SHOP PANEL - FINAL ORDER MANAGEMENT
   ========================================================= */

window.renderFinalShopOrders = function(orders) {
  const container =
    document.getElementById("shopOrdersList") ||
    document.getElementById("ordersList") ||
    document.getElementById("shop-orders-list");

  if (!container) return;

  if (!Array.isArray(orders) || !orders.length) {
    container.innerHTML = `
      <div class="shop-order-empty">
        <h3>No Orders</h3>
        <p>Abhi koi customer order nahi hai.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = orders.map(order => {
    const status = String(order.status || "pending").toLowerCase();

    const address = order.addresses || order.address || {};
    const items = Array.isArray(order.order_items)
      ? order.order_items
      : [];

    const itemHtml = items.length
      ? items.map(item => `
          <div class="shop-order-item">
            <span>
              ${escapeShopText(item.product_name || "Product")}
              ${item.variant_name
                ? ` (${escapeShopText(item.variant_name)})`
                : ""}
              × ${Number(item.quantity || 0)}
            </span>
            <strong>₹${Number(item.total || 0).toFixed(2)}</strong>
          </div>
        `).join("")
      : `<div class="shop-order-item">Items unavailable</div>`;

    const customerHtml = `
      <div class="shop-customer-box">
        <strong>${escapeShopText(
          address.recipient_name || "Customer"
        )}</strong>
        ${address.phone
          ? `<div>📞 ${escapeShopText(address.phone)}</div>`
          : ""}
        ${address.address_line1
          ? `<div>📍 ${escapeShopText(address.address_line1)}</div>`
          : ""}
        ${address.address_line2
          ? `<div>${escapeShopText(address.address_line2)}</div>`
          : ""}
        ${address.landmark
          ? `<div>Landmark: ${escapeShopText(address.landmark)}</div>`
          : ""}
        <div>
          ${escapeShopText(address.city || "Modinagar")},
          ${escapeShopText(address.pincode || "201204")}
        </div>
      </div>
    `;

    let action = "";

    if (status === "pending" || status === "placed") {
      action = `
        <button class="primary-btn"
          onclick="updateShopOrderStatus('${order.id}','confirmed')">
          Accept Order
        </button>
        <button class="danger-btn"
          onclick="rejectShopOrder('${order.id}')">
          Reject
        </button>
      `;
    } else if (status === "confirmed") {
      action = `
        <button class="primary-btn"
          onclick="updateShopOrderStatus('${order.id}','packing')">
          Start Packing
        </button>
      `;
    } else if (status === "packing") {
      action = `
        <button class="primary-btn"
          onclick="updateShopOrderStatus('${order.id}','packed')">
          Mark Ready
        </button>
      `;
    } else if (status === "packed") {
      action = `
        <button class="primary-btn"
          onclick="updateShopOrderStatus('${order.id}','out_for_delivery')">
          Send for Delivery
        </button>
      `;
    } else if (status === "out_for_delivery") {
      action = `
        <button class="primary-btn"
          onclick="markShopOrderDelivered('${order.id}')">
          Mark Delivered
        </button>
      `;
    } else if (status === "delivered") {
      action = `
        <span class="shop-complete-label">
          ✓ Delivered
        </span>
      `;
    } else if (status === "cancelled") {
      action = `
        <span class="shop-cancelled-label">
          Cancelled
        </span>
      `;
    }

    return `
      <article
        class="shop-order-card"
        data-status="${escapeShopText(status)}"
        data-order-number="${escapeShopText(order.order_number || "")}"
      >

        <div class="shop-order-top">
          <div>
            <div class="shop-order-number">
              ${escapeShopText(order.order_number || "Order")}
            </div>
            <div class="shop-order-date">
              ${formatShopDate(order.created_at)}
            </div>
          </div>

          <span class="shop-order-status status-${escapeShopText(status)}">
            ${formatShopStatus(status)}
          </span>
        </div>

        ${customerHtml}

        <div class="shop-order-items">
          ${itemHtml}
        </div>

        <div class="shop-order-total">
          <span>Total</span>
          <strong>₹${Number(order.total || 0).toFixed(2)}</strong>
        </div>

        <div class="shop-order-payment">
          Payment:
          <strong>COD</strong>
        </div>

        <div class="shop-order-actions">
          <button
            class="shop-details-btn"
            type="button"
            onclick="openShopOrderDetails('${order.id}')">
            View Order Details
          </button>
          ${action}
        </div>
      </article>
    `;
  }).join("");
};


window.escapeShopText = function(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
};


window.formatShopDate = function(value) {
  if (!value) return "";

  try {
    return new Date(value).toLocaleString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch (_) {
    return "";
  }
};


window.formatShopStatus = function(status) {
  const map = {
    pending: "New Order",
    placed: "New Order",
    confirmed: "Confirmed",
    packing: "Packing",
    packed: "Ready",
    out_for_delivery: "Out for Delivery",
    delivered: "Delivered",
    cancelled: "Cancelled"
  };

  return map[status] || status;
};


/* ---------------------------------------------------------
   FINAL SEARCH + STATUS FILTER
   --------------------------------------------------------- */

window.filterFinalShopOrders = function() {
  const searchEl =
    document.getElementById("shopOrderSearch");

  const statusEl =
    document.getElementById("shopOrderStatusFilter");

  const search = String(
    searchEl?.value || ""
  ).trim().toLowerCase();

  const status = String(
    statusEl?.value || "all"
  ).toLowerCase();

  document
    .querySelectorAll(".shop-order-card")
    .forEach(card => {
      const number =
        String(card.dataset.orderNumber || "")
          .toLowerCase();

      const text =
        card.textContent.toLowerCase();

      const cardStatus =
        String(card.dataset.status || "")
          .toLowerCase();

      const matchesSearch =
        !search ||
        number.includes(search) ||
        text.includes(search);

      const matchesStatus =
        status === "all" ||
        cardStatus === status;

      card.style.display =
        matchesSearch && matchesStatus
          ? ""
          : "none";
    });
};


/* ---------------------------------------------------------
   FILTER UI
   --------------------------------------------------------- */

window.addFinalShopOrderFilters = function() {
  const section =
    document.getElementById("ordersSection") ||
    document.getElementById("shopOrdersSection");

  if (!section) return;

  if (document.getElementById("finalShopOrderFilters")) {
    return;
  }

  const filters = document.createElement("div");
  filters.id = "finalShopOrderFilters";
  filters.className = "shop-order-filters";

  filters.innerHTML = `
    <input
      id="shopOrderSearch"
      type="search"
      placeholder="Search order or customer..."
    >

    <select id="shopOrderStatusFilter">
      <option value="all">All Orders</option>
      <option value="pending">New</option>
      <option value="confirmed">Confirmed</option>
      <option value="packing">Packing</option>
      <option value="packed">Ready</option>
      <option value="out_for_delivery">
        Out for Delivery
      </option>
      <option value="delivered">Delivered</option>
      <option value="cancelled">Cancelled</option>
    </select>
  `;

  section.prepend(filters);

  document
    .getElementById("shopOrderSearch")
    .addEventListener(
      "input",
      window.filterFinalShopOrders
    );

  document
    .getElementById("shopOrderStatusFilter")
    .addEventListener(
      "change",
      window.filterFinalShopOrders
    );
};


/* ---------------------------------------------------------
   SAFE STATUS UPDATE
   --------------------------------------------------------- */

window.updateShopOrderStatus = async function(
  orderId,
  newStatus
) {
  try {
    if (!orderId || !newStatus) return;

    const token =
      localStorage.getItem("delyvo_shop_token");

    if (!token) {
      alert("Shop login required.");
      return;
    }

    const response = await fetch(
      `${SHOP_SUPABASE_URL}/rest/v1/rpc/transition_order_status`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SHOP_SUPABASE_KEY,
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({
          p_order_id: orderId,
          p_new_status: newStatus
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.message ||
        data.hint ||
        data.details ||
        "Status update failed."
      );
    }

    if (typeof window.loadShopOrders === "function") {
      await window.loadShopOrders();
    } else if (typeof window.loadOrders === "function") {
      await window.loadOrders();
    } else {
      location.reload();
    }

  } catch (error) {
    console.error(error);
    alert(error.message || "Order status update failed.");
  }
};


/* ---------------------------------------------------------
   INITIALIZE
   --------------------------------------------------------- */

document.addEventListener(
  "DOMContentLoaded",
  function() {
    setTimeout(
      window.addFinalShopOrderFilters,
      500
    );
  }
);

</script>


<script>
/* =========================================================
   DELYVO SHOP - FINAL PRODUCT + STOCK MANAGEMENT
   ========================================================= */

window.finalShopProducts = [];

window.loadFinalShopProducts = async function () {
  try {
    const token = localStorage.getItem("delyvo_shop_token");

    if (!token) {
      return;
    }

    const headers = {
      apikey: SHOP_SUPABASE_KEY,
      Authorization: `Bearer ${token}`
    };

    const [productsResponse, variantsResponse, inventoryResponse] =
      await Promise.all([
        fetch(
          `${SHOP_SUPABASE_URL}/rest/v1/products?select=id,name,slug,is_active`,
          { headers }
        ),

        fetch(
          `${SHOP_SUPABASE_URL}/rest/v1/product_variants?select=id,product_id,name,sku,mrp,selling_price,is_active,quantity_value,quantity_unit&order=name.asc`,
          { headers }
        ),

        fetch(
          `${SHOP_SUPABASE_URL}/rest/v1/inventory?select=id,product_id,variant_id,stock_qty,reserved_qty,reorder_level&store_id=eq.7ef989c8-9826-437b-8a63-bb0dfa817540`,
          { headers }
        )
      ]);

    const products = await productsResponse.json();
    const variants = await variantsResponse.json();
    const inventory = await inventoryResponse.json();

    if (!productsResponse.ok) {
      throw new Error("Products load nahi hue.");
    }

    if (!variantsResponse.ok) {
      throw new Error("Product variants load nahi hue.");
    }

    if (!inventoryResponse.ok) {
      throw new Error("Inventory load nahi hua.");
    }

    const productMap = {};

    products.forEach(product => {
      productMap[product.id] = product;
    });

    const inventoryMap = {};

    inventory.forEach(row => {
      inventoryMap[row.variant_id] = row;
    });

    window.finalShopProducts = variants.map(variant => {
      const product = productMap[variant.product_id] || {};
      const stock = inventoryMap[variant.id] || {};

      return {
        id: variant.id,
        product_id: variant.product_id,
        name: product.name || "Product",
        variant_name: variant.name || "",
        sku: variant.sku || "",
        mrp: Number(variant.mrp || 0),
        selling_price: Number(variant.selling_price || 0),
        is_active: variant.is_active !== false,
        stock_qty: Number(stock.stock_qty || 0),
        reserved_qty: Number(stock.reserved_qty || 0),
        reorder_level: Number(stock.reorder_level || 5),
        inventory_id: stock.id || null,
        quantity_value: variant.quantity_value,
        quantity_unit: variant.quantity_unit
      };
    });

    window.renderFinalShopProducts();

  } catch (error) {
    console.error("PRODUCT LOAD ERROR:", error);
  }
};


/* ---------------------------------------------------------
   PRODUCT RENDER
   --------------------------------------------------------- */

window.renderFinalShopProducts = function () {
  const section =
    document.getElementById("productsSection") ||
    document.getElementById("shopProductsSection");

  if (!section) return;

  /* DELYVO SHOP PRODUCT MANAGEMENT UI V2 */
  if (!document.getElementById("delyvoProductTools")) {
    const tools = document.createElement("div");
    tools.id = "delyvoProductTools";

    tools.innerHTML = `
      <div class="delyvo-product-tools">
        <div class="delyvo-product-search">
          <input
            id="delyvoProductSearch"
            type="search"
            placeholder="Search product or SKU..."
            autocomplete="off"
          >
        </div>

        <div class="delyvo-product-filters">
          <button
            type="button"
            class="delyvo-product-filter active"
            data-product-filter="all">
            All
          </button>

          <button
            type="button"
            class="delyvo-product-filter"
            data-product-filter="active">
            Active
          </button>

          <button
            type="button"
            class="delyvo-product-filter"
            data-product-filter="low">
            Low Stock
          </button>

          <button
            type="button"
            class="delyvo-product-filter"
            data-product-filter="inactive">
            Inactive
          </button>
        </div>

        <div id="delyvoProductCount" class="delyvo-product-count">
          Products: 0
        </div>
      </div>
    `;

    section.prepend(tools);

    tools.querySelectorAll("[data-product-filter]").forEach(button => {
      button.addEventListener("click", () => {
        tools
          .querySelectorAll("[data-product-filter]")
          .forEach(item => item.classList.remove("active"));

        button.classList.add("active");

        window.__delyvoProductFilter =
          button.getAttribute("data-product-filter") || "all";

        window.applyDelyvoProductManagementFilter();
      });
    });

    const searchInput =
      document.getElementById("delyvoProductSearch");

    if (searchInput) {
      searchInput.addEventListener("input", () => {
        window.__delyvoProductSearch =
          String(searchInput.value || "").trim().toLowerCase();

        window.applyDelyvoProductManagementFilter();
      });
    }
  }

  let container =
    document.getElementById("finalShopProductsList");

  if (!container) {
    container = document.createElement("div");
    container.id = "finalShopProductsList";
    section.appendChild(container);
  }

  let container =
    document.getElementById("finalShopProductsList");

  if (!container) {
    container = document.createElement("div");
    container.id = "finalShopProductsList";
    section.appendChild(container);
  }

  if (!window.finalShopProducts.length) {
    container.innerHTML = `
      <div class="shop-product-empty">
        No products found.
      </div>
    `;
    return;
  }

  container.innerHTML =
    window.finalShopProducts.map(product => {

      const available =
        product.stock_qty - product.reserved_qty;

      const lowStock =
        available <= product.reorder_level;

      const inactive =
        !product.is_active;

      const statusText =
        inactive
          ? "Inactive"
          : lowStock
            ? "Low Stock"
            : "Active";

      const statusClass =
        inactive
          ? "inactive"
          : lowStock
            ? "low"
            : "active";

      return `
        <div
          class="final-shop-product"
          data-product-id="${product.id}"
          data-name="${escapeShopText(
            product.name + " " + product.variant_name
          ).toLowerCase()}"
          data-status="${statusClass}"
        >

          <div class="final-product-main">

            <div class="final-product-info">
              <strong>
                ${escapeShopText(product.name)}
              </strong>

              ${
                product.variant_name
                  ? `<span>
                      ${escapeShopText(product.variant_name)}
                    </span>`
                  : ""
              }

              ${
                product.sku
                  ? `<small>
                      SKU: ${escapeShopText(product.sku)}
                    </small>`
                  : ""
              }
            </div>

            <span class="final-product-status ${statusClass}">
              ${statusText}
            </span>

          </div>


          <div class="final-product-fields">

            <label>
              MRP
              <input
                type="number"
                step="0.01"
                min="0"
                data-field="mrp"
                value="${product.mrp}"
              >
            </label>

            <label>
              Selling Price
              <input
                type="number"
                step="0.01"
                min="0"
                data-field="selling_price"
                value="${product.selling_price}"
              >
            </label>

            <label>
              Stock
              <input
                type="number"
                step="1"
                min="0"
                data-field="stock_qty"
                value="${product.stock_qty}"
              >
            </label>

          </div>


          <div class="final-product-bottom">

            <div>
              Available:
              <strong>
                ${available}
              </strong>

              <span class="final-stock-breakdown">
                Stock ${product.stock_qty}
                · Reserved ${product.reserved_qty}
              </span>

              ${
                lowStock
                  ? `<span class="final-low-stock">
                      Low stock
                    </span>`
                  : ""
              }
            </div>

            <div class="final-product-buttons">

              <button
                class="secondary-btn"
                onclick="toggleFinalShopProduct('${product.id}')"
              >
                ${product.is_active ? "Turn Off" : "Turn On"}
              </button>

              <button
                class="primary-btn"
                onclick="saveFinalShopProduct('${product.id}')"
              >
                Save
              </button>

            </div>

          </div>

        </div>
      `;
    }).join("");
};



/* ---------------------------------------------------------
   PRODUCT MANAGEMENT FILTER
   --------------------------------------------------------- */

window.__delyvoProductFilter = "all";
window.__delyvoProductSearch = "";

window.applyDelyvoProductManagementFilter = function () {
  const cards =
    document.querySelectorAll(".final-shop-product");

  const filter =
    window.__delyvoProductFilter || "all";

  const search =
    String(window.__delyvoProductSearch || "").toLowerCase();

  let visible = 0;

  cards.forEach(card => {
    const name =
      String(card.getAttribute("data-name") || "").toLowerCase();

    const status =
      String(card.getAttribute("data-status") || "").toLowerCase();

    const matchesSearch =
      !search || name.includes(search);

    let matchesFilter = true;

    if (filter === "active") {
      matchesFilter = status === "active";
    }

    if (filter === "low") {
      matchesFilter = status === "low";
    }

    if (filter === "inactive") {
      matchesFilter = status === "inactive";
    }

    const show =
      matchesSearch && matchesFilter;

    card.style.display =
      show ? "" : "none";

    if (show) visible++;
  });

  const count =
    document.getElementById("delyvoProductCount");

  if (count) {
    count.textContent =
      `Products: ${visible}`;
  }
};

/* ---------------------------------------------------------
   SAVE PRODUCT
   --------------------------------------------------------- */

window.saveFinalShopProduct = async function (variantId) {
  try {
    const token =
      localStorage.getItem("delyvo_shop_token");

    const card =
      document.querySelector(
        `.final-shop-product[data-product-id="${variantId}"]`
      );

    if (!card) return;

    const product =
      window.finalShopProducts.find(
        item => item.id === variantId
      );

    if (!product) return;

    const mrp =
      Number(
        card.querySelector(
          '[data-field="mrp"]'
        ).value
      );

    const sellingPrice =
      Number(
        card.querySelector(
          '[data-field="selling_price"]'
        ).value
      );

    const stock =
      Number(
        card.querySelector(
          '[data-field="stock_qty"]'
        ).value
      );

    if (mrp < 0 || sellingPrice < 0 || stock < 0) {
      alert("Price aur stock 0 se kam nahi ho sakta.");
      return;
    }

    if (sellingPrice > mrp) {
      alert("Selling price MRP se zyada nahi ho sakta.");
      return;
    }

    const headers = {
      "Content-Type": "application/json",
      apikey: SHOP_SUPABASE_KEY,
      Authorization: `Bearer ${token}`,
      Prefer: "return=minimal"
    };

    const variantResponse =
      await fetch(
        `${SHOP_SUPABASE_URL}/rest/v1/product_variants?id=eq.${variantId}`,
        {
          method: "PATCH",
          headers,
          body: JSON.stringify({
            mrp: mrp,
            selling_price: sellingPrice
          })
        }
      );

    if (!variantResponse.ok) {
      const error = await variantResponse.text();
      throw new Error(error || "Product price save failed.");
    }

    if (product.inventory_id) {
      const inventoryResponse =
        await fetch(
          `${SHOP_SUPABASE_URL}/rest/v1/inventory?id=eq.${product.inventory_id}`,
          {
            method: "PATCH",
            headers,
            body: JSON.stringify({
              stock_qty: stock,
              updated_at: new Date().toISOString()
            })
          }
        );

      if (!inventoryResponse.ok) {
        const error = await inventoryResponse.text();
        throw new Error(
          error || "Inventory save failed."
        );
      }
    }

    alert("Product updated successfully.");

    await window.loadFinalShopProducts();

    if (typeof window.loadShopDashboard === "function") {
      await window.loadShopDashboard();
    }

  } catch (error) {
    console.error(error);
    alert(error.message || "Product update failed.");
  }
};


/* ---------------------------------------------------------
   ACTIVE / INACTIVE
   --------------------------------------------------------- */

window.toggleFinalShopProduct = async function (variantId) {
  try {
    const token =
      localStorage.getItem("delyvo_shop_token");

    const product =
      window.finalShopProducts.find(
        item => item.id === variantId
      );

    if (!product) return;

    const newState =
      !product.is_active;

    const response =
      await fetch(
        `${SHOP_SUPABASE_URL}/rest/v1/product_variants?id=eq.${variantId}`,
        {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            apikey: SHOP_SUPABASE_KEY,
            Authorization: `Bearer ${token}`,
            Prefer: "return=minimal"
          },
          body: JSON.stringify({
            is_active: newState
          })
        }
      );

    if (!response.ok) {
      throw new Error(
        "Product status update failed."
      );
    }

    await window.loadFinalShopProducts();

  } catch (error) {
    console.error(error);
    alert(error.message || "Product status update failed.");
  }
};

<script>
/* =========================================================
   DELYVO SHOP - FINAL DASHBOARD
   ========================================================= */

window.loadFinalShopDashboard = async function () {
  try {
    const token = localStorage.getItem("delyvo_shop_token");

    if (!token) return;

    const headers = {
      apikey: SHOP_SUPABASE_KEY,
      Authorization: `Bearer ${token}`
    };

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const todayISO = today.toISOString();

    const [
      ordersResponse,
      productsResponse,
      inventoryResponse
    ] = await Promise.all([
      fetch(
        `${SHOP_SUPABASE_URL}/rest/v1/orders?select=id,status,total,created_at&created_at=gte.${encodeURIComponent(todayISO)}&order=created_at.desc`,
        { headers }
      ),

      fetch(
        `${SHOP_SUPABASE_URL}/rest/v1/product_variants?select=id,is_active`,
        { headers }
      ),

      fetch(
        `${SHOP_SUPABASE_URL}/rest/v1/inventory?select=id,stock_qty,reserved_qty,reorder_level&store_id=eq.7ef989c8-9826-437b-8a63-bb0dfa817540`,
        { headers }
      )
    ]);

    const orders = await ordersResponse.json();
    const products = await productsResponse.json();
    const inventory = await inventoryResponse.json();

    if (!ordersResponse.ok) {
      throw new Error("Orders dashboard load failed.");
    }

    if (!productsResponse.ok) {
      throw new Error("Products dashboard load failed.");
    }

    if (!inventoryResponse.ok) {
      throw new Error("Inventory dashboard load failed.");
    }

    const safeOrders =
      Array.isArray(orders) ? orders : [];

    const safeProducts =
      Array.isArray(products) ? products : [];

    const safeInventory =
      Array.isArray(inventory) ? inventory : [];

    const totalOrders =
      safeOrders.length;

    const pendingOrders =
      safeOrders.filter(order =>
        ["pending", "placed"].includes(
          String(order.status || "").toLowerCase()
        )
      ).length;

    const preparingOrders =
      safeOrders.filter(order =>
        ["confirmed", "packing", "packed"].includes(
          String(order.status || "").toLowerCase()
        )
      ).length;

    const outForDeliveryOrders =
      safeOrders.filter(order =>
        String(order.status || "").toLowerCase() ===
        "out_for_delivery"
      ).length;

    const deliveredOrders =
      safeOrders.filter(order =>
        String(order.status || "").toLowerCase() ===
        "delivered"
      ).length;

    const todaySales =
      safeOrders
        .filter(order =>
          String(order.status || "").toLowerCase() !==
          "cancelled"
        )
        .reduce(
          (sum, order) =>
            sum + Number(order.total || 0),
          0
        );

    const lowStock =
      safeInventory.filter(item => {
        const available =
          Number(item.stock_qty || 0) -
          Number(item.reserved_qty || 0);

        return available <=
          Number(item.reorder_level || 5);
      }).length;

    const activeProducts =
      safeProducts.filter(
        product => product.is_active !== false
      ).length;

    const setValue = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    };

    setValue("finalDashOrders", totalOrders);
    setValue("finalDashPending", pendingOrders);
    setValue("finalDashPreparing", preparingOrders);
    setValue("finalDashDelivery", outForDeliveryOrders);
    setValue(
      "finalDashSales",
      `₹${todaySales.toFixed(2)}`
    );
    setValue("finalDashLowStock", lowStock);
    setValue("finalDashProducts", activeProducts);
    setValue(
      "finalDashDelivered",
      deliveredOrders
    );

    const updated =
      document.getElementById(
        "finalDashUpdated"
      );

    if (updated) {
      updated.textContent =
        `Updated ${new Date().toLocaleTimeString(
          "en-IN",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        )}`;
    }

  } catch (error) {
    console.error(
      "FINAL DASHBOARD ERROR:",
      error
    );
  }
};

      "delyvoNewOrderAlert"

    const orders = getOrderList();

        order &&
        order.id &&
        (
          order.status === "pending" ||
          order.status === "placed"

      .map(order => order.id);

    if (firstLoad) {
      lastOrderIds = currentIds;
      firstLoad = false;

    const newOrders = currentIds.filter(
      id => !lastOrderIds.includes(id)
    );

    if (newOrders.length) {

        audio.play().catch(() => {});

      ) {
        await window.loadShopOrders();
      } else if (
        typeof window.loadShop === "function"
      ) {
        await window.loadShop();

    } catch (error) {
      console.error(
        "DELYVO SHOP AUTO REFRESH ERROR:",
        error

<script>
/* =========================================================
   DELYVO SHOP DASHBOARD V3

   ========================================================= */
(() => {
  const MARKER = "DELYVO SHOP DASHBOARD V3";

  function esc(value) {
    if (typeof window.escapeShopText === "function") {
      return window.escapeShopText(value);
    }
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function statusLabel(status) {
    if (typeof window.formatShopStatus === "function") {
      return window.formatShopStatus(status);
    }

    const map = {
      pending: "New Order",
      placed: "New Order",
      confirmed: "Confirmed",
      packing: "Packing",
      packed: "Ready",
      out_for_delivery: "Out for Delivery",
      delivered: "Delivered",
      cancelled: "Cancelled"
    };

    return map[status] || status;
  }

  function addDashboardSummary() {
    const dashboard = document.getElementById("finalShopDashboard");
    if (!dashboard) return;

    if (dashboard.querySelector(".delyvo-dashboard-v3")) return;

    const box = document.createElement("div");
    box.className = "delyvo-dashboard-v3";

    box.innerHTML = `

          <div>
            <h3>Recent Orders</h3>
            <p>Latest customer orders</p>

             class="delyvo-dashboard-list">
          Loading orders...
        </div>
      </div>

      <div class="delyvo-dashboard-panel">
        <div class="delyvo-dashboard-panel-head">
          <div>
            <h3>Low Stock Products</h3>
            <p>Products needing attention</p>

            type="button"
            class="secondary-btn"
            onclick="delyvoOpenLowStockProducts()">
            View Stock
          </button>
        </div>

        <div id="delyvoDashboardLowStock"
             class="delyvo-dashboard-list">
          Loading stock...
        </div>
      </div>
    `;

    dashboard.appendChild(box);
  }

  function renderRecentOrders() {
    const box =
      document.getElementById("delyvoDashboardRecentOrders");

    if (!box) return;

    const orders =
      Array.isArray(window.delyvoShopOrders)
        ? window.delyvoShopOrders
        : [];

    if (!orders.length) {
      box.innerHTML = `
        <div class="delyvo-dashboard-empty">
          No orders found.
        </div>
      `;
      return;
    }

    box.innerHTML = orders
      .slice(0, 5)
      .map(order => {
        const status =
          String(order.status || "pending").toLowerCase();

        const address =
          order.addresses ||
          order.address ||
          {};

        const name =
          address.recipient_name ||
          "Customer";

        return `
          <div class="delyvo-dashboard-order-row">
            <div>
              <strong>${esc(order.order_number || "Order")}</strong>
              <span>${esc(name)}</span>
            </div>

            <div class="delyvo-dashboard-order-right">
              <strong>₹${Number(order.total || 0).toFixed(2)}</strong>
              <span class="status-${esc(status)}">
                ${esc(statusLabel(status))}
              </span>
            </div>
          </div>
        `;
      })
      .join("");
  }

  function renderLowStock() {
    const box =
      document.getElementById("delyvoDashboardLowStock");

    if (!box) return;

    const products =
      Array.isArray(window.finalShopProducts)
        ? window.finalShopProducts
        : [];

    const low = products
      .filter(product => {
        const available =
          Number(product.stock_qty || 0) -
          Number(product.reserved_qty || 0);

        return (
          product.is_active !== false &&
          available <= Number(product.reorder_level || 5)
        );
      })
      .sort((a, b) => {
        const aa =
          Number(a.stock_qty || 0) -
          Number(a.reserved_qty || 0);

        const bb =
          Number(b.stock_qty || 0) -
          Number(b.reserved_qty || 0);

        return aa - bb;
      })
      .slice(0, 5);

    if (!low.length) {
      box.innerHTML = `
        <div class="delyvo-dashboard-empty">
          No low-stock products.
        </div>
      `;
      return;
    }

    box.innerHTML = low
      .map(product => {
        const available =
          Number(product.stock_qty || 0) -
          Number(product.reserved_qty || 0);

        return `
          <div class="delyvo-dashboard-stock-row">
            <div>
              <strong>${esc(product.name || "Product")}</strong>
              <span>
                ${esc(product.variant_name || "")}
              </span>
            </div>

            <div class="delyvo-dashboard-stock-count">
              ${available}
            </div>
          </div>
        `;
      })
      .join("");
  }

    renderRecentOrders();
    renderLowStock();
  }

    style.textContent = `

        gap: 16px;

      }

        background: #fff;

        padding: 16px;
      }

      .delyvo-dashboard-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .delyvo-dashboard-panel-head h3 {
        margin: 0;
        font-size: 17px;
      }

      .delyvo-dashboard-panel-head p {
        margin: 4px 0 0;
        color: #777;
        font-size: 12px;
      }

      .delyvo-dashboard-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .delyvo-dashboard-order-row,
      .delyvo-dashboard-stock-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid #eee;
      }

      .delyvo-dashboard-order-row:last-child,
      .delyvo-dashboard-stock-row:last-child {
        border-bottom: 0;
      }

      .delyvo-dashboard-order-row span,
      .delyvo-dashboard-stock-row span {
        display: block;
        margin-top: 3px;
        color: #777;
        font-size: 12px;
      }

      .delyvo-dashboard-order-right {
        text-align: right;
      }

      .delyvo-dashboard-order-right span {
        font-size: 11px;
      }

      .delyvo-dashboard-stock-count {
        min-width: 38px;
        text-align: center;
        font-weight: 700;
      }

      .delyvo-dashboard-empty {
        padding: 18px 4px;
        color: #777;
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 700px) {
        .delyvo-dashboard-v3 {
          grid-template-columns: 1fr;
        }

        .delyvo-dashboard-panel-head {
          align-items: flex-start;
        }
      }
    `;

    document.head.appendChild(style);
  }

  function init() {

    const dashboard =
      document.getElementById("finalShopDashboard");

    if (!dashboard) {
      setTimeout(init, 500);
      return;

    refreshSummary();
  }

  window.delyvoRefreshDashboardSummary =
    refreshSummary;

  window.addEventListener("load", () => {
    setTimeout(init, 1200);
  });

  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(init, 1200);

  console.log(MARKER);
  console.log("Recent orders : YES");

<script>
/* =========================================================
   DELYVO SHOP DASHBOARD V4
   Auto Sync Recent Orders + Low Stock
   ========================================================= */
(() => {
  const MARKER = "DELYVO SHOP DASHBOARD V4";

  async function syncDashboardData() {
    try {
      if (!localStorage.getItem("delyvo_shop_token")) {
        return;
      }

      if (typeof window.loadShopOrders === "function") {
        await window.loadShopOrders();
      }

      if (typeof window.loadFinalShopProducts === "function") {
        await window.loadFinalShopProducts();
      }

      if (typeof window.loadFinalShopDashboard === "function") {
        await window.loadFinalShopDashboard();
      }

      if (typeof window.delyvoRefreshDashboardSummary === "function") {
        window.delyvoRefreshDashboardSummary();
      }

      const updated =
        document.getElementById("finalDashUpdated");

      if (updated) {
        updated.textContent =
          `Updated ${new Date().toLocaleTimeString(
            "en-IN",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          )}`;
      }
    } catch (error) {
      console.log(
        "DELYVO DASHBOARD SYNC:",
        error.message
      );
    }
  }

  let syncTimer = null;

  function startDashboardSync() {
    if (syncTimer) {
      clearInterval(syncTimer);
    }

    syncTimer = setInterval(
      syncDashboardData,
      30000
    );
  }

  window.delyvoSyncDashboardData =
    syncDashboardData;

  window.delyvoStartDashboardSync =
    startDashboardSync;

  window.addEventListener("load", () => {
    setTimeout(() => {
      startDashboardSync();
    }, 2000);
  });

  document.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(() => {
        startDashboardSync();
      }, 2000);
    }
  );

  console.log(MARKER);
  console.log("Orders auto sync : YES");
  console.log("Products auto sync : YES");
  console.log("Low stock auto sync : YES");
  console.log("Dashboard summary sync : YES");
  console.log("Existing refresh preserved : YES");
})();
</script>

    let delivery = 0;

        status === "confirmed" ||
        status === "packing" ||
        status === "packed"

      ) {

      ) {
        delivered++;
        deliveredSales += total;
      } else if (
        status === "cancelled"
      ) {
        cancelled++;
        cancelledSales += total;
      }

      if (status !== "cancelled") {
        activeSales += total;

<script>
/* =========================================================
   DELYVO SHOP DASHBOARD V6
   COD Payment Summary
   ========================================================= */
(() => {
  const MARKER = "DELYVO SHOP DASHBOARD V6";

  function updateCODSummary() {
    const orders = Array.isArray(window.delyvoShopOrders)
      ? window.delyvoShopOrders
      : [];

    let codOrders = 0;
    let codPendingOrders = 0;
    let codPaidOrders = 0;

    let codTotal = 0;
    let codPendingAmount = 0;
    let codPaidAmount = 0;

    orders.forEach(order => {
      const total = Number(order.total || 0);
      const paymentStatus =
        String(order.payment_status || "pending").toLowerCase();

      if (
        paymentStatus === "paid" ||
        paymentStatus === "pending" ||
        paymentStatus === "failed" ||
        paymentStatus === "refunded"
      ) {
        codOrders++;
        codTotal += total;
      }

    setValue("dashV6CODPendingOrders", codPendingOrders);

<script>
(function () {
  "use strict";

  let v65Busy = false;
  let v65Timer = null;

  async function syncShopOrdersV65() {
    if (v65Busy) return;
    v65Busy = true;

    try {
      if (typeof window.loadShopOrders === "function") {
        await window.loadShopOrders();
      } else if (typeof window.loadShop === "function") {
        await window.loadShop();
      }

      if (typeof window.loadFinalShopDashboard === "function") {
        await window.loadFinalShopDashboard();
      }

      if (typeof window.delyvoRefreshDashboardSummary === "function") {
        await window.delyvoRefreshDashboardSummary();
      }

      window.dispatchEvent(new CustomEvent("delyvoShopOrdersSynced", {
        detail: {
          reason: "auto_refresh"
        }
      }));
    } catch (e) {
      console.warn("DELYVO V65 shop order sync failed:", e);
    } finally {
      v65Busy = false;
    }
  }

  function startShopOrderSyncV65() {
    if (v65Timer) return;

    v65Timer = setInterval(function () {
      syncShopOrdersV65();
    }, 30000);

    window.delyvoShopOrderSyncTimerV65 = v65Timer;
  }

  function stopShopOrderSyncV65() {
    if (!v65Timer) return;

    clearInterval(v65Timer);
    v65Timer = null;
    window.delyvoShopOrderSyncTimerV65 = null;
  }

  window.delyvoSyncShopOrdersV65 = syncShopOrdersV65;
  window.delyvoStartShopOrderSyncV65 = startShopOrderSyncV65;
  window.delyvoStopShopOrderSyncV65 = stopShopOrderSyncV65;

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopShopOrderSyncV65();
    } else {
      syncShopOrdersV65();
      startShopOrderSyncV65();
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(function () {
      syncShopOrdersV65();
      startShopOrderSyncV65();
    }, 2500);
  });

})();

<!-- DELYVO SHOP ORDER STATUS FLOW V67 -->
<script>
(function () {
  "use strict";

  const STATUS_FLOW_V67 = {
    pending: {
      next: "confirmed",
      label: "Accept Order"
    },
    placed: {
      next: "confirmed",
      label: "Accept Order"
    },
    confirmed: {
      next: "packing",
      label: "Start Packing"
    },
    packing: {
      next: "packed",
      label: "Mark Ready"
    },
    packed: {
      next: "out_for_delivery",
      label: "Send for Delivery"
    },
    out_for_delivery: {
      next: "delivered",
      label: "Mark Delivered"
    }
  };

  function getNextStatusV67(status) {
    const key = String(status || "").toLowerCase();
    return STATUS_FLOW_V67[key] || null;
  }

  async function updateOrderStatusV67(orderId, currentStatus) {
    const flow = getNextStatusV67(currentStatus);

    if (!flow || !orderId) {
      return false;
    }

    if (typeof window.updateShopOrderStatus === "function") {
      await window.updateShopOrderStatus(
        orderId,
        flow.next
      );

      window.dispatchEvent(new CustomEvent("delyvoShopOrderStatusChanged", {
        detail: {
          orderId: orderId,
          oldStatus: currentStatus,
          newStatus: flow.next
        }
      }));

      return true;
    }

    return false;
  }

  function getStatusActionV67(status, orderId) {
    const flow = getNextStatusV67(status);

    if (!flow) return "";

    return (
      '<button type="button" ' +
      'class="delyvo-shop-status-btn-v67" ' +
      'data-order-id="' + String(orderId || "") + '" ' +
      'data-current-status="' + String(status || "") + '">' +
      flow.label +
      '</button>'
    );
  }

  window.delyvoGetNextStatusV67 = getNextStatusV67;
  window.delyvoUpdateOrderStatusV67 = updateOrderStatusV67;
  window.delyvoGetStatusActionV67 = getStatusActionV67;

  document.addEventListener("click", async function (event) {
    const button = event.target.closest(
      ".delyvo-shop-status-btn-v67"
    );

    if (!button) return;

    const orderId = button.getAttribute("data-order-id");
    const currentStatus = button.getAttribute(
      "data-current-status"
    );

    if (!orderId || !currentStatus) return;

    button.disabled = true;
    button.textContent = "Updating...";

    try {
      await updateOrderStatusV67(
        orderId,
        currentStatus
      );
    } catch (e) {
      console.error(
        "DELYVO V67 status update failed:",
        e
      );

      button.disabled = false;

      const flow = getNextStatusV67(currentStatus);
      button.textContent = flow
        ? flow.label
        : "Update";
    }
  });

  document.addEventListener(
    "delyvoShopOrdersSynced",
    function () {
      window.dispatchEvent(
        new CustomEvent("delyvoShopStatusFlowReady", {
          detail: {
            flow: STATUS_FLOW_V67
          }
        })
      );
    }
  );

  console.log("DELYVO SHOP ORDER STATUS FLOW V67 ADDED");
})();
</script>
<!-- END DELYVO SHOP ORDER STATUS FLOW V67 -->


<!-- DELYVO SHOP ORDER DETAILS SYNC V68 -->
<script>
(function () {
  "use strict";

  let activeOrderIdV68 = null;

  function refreshActiveOrderDetailsV68() {
    if (!activeOrderIdV68) return;

    try {
      if (typeof window.openShopOrderDetails === "function") {
        window.openShopOrderDetails(activeOrderIdV68);
      }
    } catch (e) {
      console.warn(
        "DELYVO V68 order details refresh failed:",
        e
      );
    }
  }

  function rememberOrderV68(orderId) {
    if (!orderId) return;

    activeOrderIdV68 = orderId;

    try {
      sessionStorage.setItem(
        "delyvo_active_shop_order_v68",
        orderId
      );
    } catch (e) {}
  }

  function restoreOrderV68() {
    if (activeOrderIdV68) return;

    try {
      activeOrderIdV68 =
        sessionStorage.getItem(
          "delyvo_active_shop_order_v68"
        ) || null;
    } catch (e) {}
  }

  window.delyvoRememberShopOrderV68 = rememberOrderV68;
  window.delyvoRefreshShopOrderDetailsV68 =
    refreshActiveOrderDetailsV68;

  document.addEventListener("click", function (event) {
    const button = event.target.closest(
      ".shop-details-btn"
    );

    if (!button) return;

    const onclickValue =
      button.getAttribute("onclick") || "";

    const match =
      onclickValue.match(
        /openShopOrderDetails\(['"]([^'"]+)['"]\)/
      );

    if (match && match[1]) {
      rememberOrderV68(match[1]);
    }
  });

  document.addEventListener(
    "delyvoShopOrderStatusChanged",
    function (event) {

      pending: {

      }
    };

<script>
(function () {
  "use strict";

  const STATUS_LABELS_V72 = {
    pending: "Order Received",
    placed: "Order Received",
    confirmed: "Order Confirmed",
    packing: "Packing",
    packed: "Ready",
    out_for_delivery: "Out for Delivery",
    delivered: "Delivered",
    cancelled: "Cancelled",
    refunded: "Refunded"
  };

  function statusLabelV72(status) {
    const key =
      String(status || "")
        .toLowerCase()
        .trim();

    return STATUS_LABELS_V72[key] || status || "Unknown";
  }

  function getOrderFromCacheV72(orderId) {
    const orders =
      window.delyvoShopOrders ||
      window.shopOrders ||
      [];

    return orders.find(function (order) {
      return String(order.id) === String(orderId);
    }) || null;
  }

  function renderStatusHistoryV72(orderId) {
    const order =
      getOrderFromCacheV72(orderId);

    if (!order) return "";

    const currentStatus =
      String(order.status || "")
        .toLowerCase()
        .trim();

    const steps = [
      "pending",
      "confirmed",
      "packing",
      "packed",
      "out_for_delivery",
      "delivered"
    ];

    const currentIndex =
      steps.indexOf(currentStatus);

    let html =
      '<div class="delyvo-status-history-v72">' +
      '<div class="delyvo-status-history-title-v72">' +
      'Order Status' +
      '</div>';

    steps.forEach(function (status, index) {
      let state = "upcoming";

      if (
        currentStatus === "cancelled" ||
        currentStatus === "refunded"
      ) {
        state = "cancelled";
      } else if (index < currentIndex) {
        state = "completed";
      } else if (index === currentIndex) {
        state = "current";
      }

      html +=
        '<div class="delyvo-status-history-row-v72 ' +
        state +
        '">' +
        '<span class="delyvo-status-dot-v72"></span>' +
        '<span class="delyvo-status-name-v72">' +
        statusLabelV72(status) +
        '</span>' +
        '</div>';
    });

    if (
      currentStatus === "cancelled" ||
      currentStatus === "refunded"
    ) {
      html +=
        '<div class="delyvo-status-history-row-v72 cancelled">' +
        '<span class="delyvo-status-dot-v72"></span>' +
        '<span class="delyvo-status-name-v72">' +
        statusLabelV72(currentStatus) +
        '</span>' +
        '</div>';
    }

    html += "</div>";

    return html;
  }

  function addStatusHistoryV72(orderId) {
    const modal =
      document.getElementById(
        "delyvoShopOrderDetails"
      );

    if (!modal || !orderId) return;

    const existing =
      modal.querySelector(
        ".delyvo-status-history-v72"
      );

    if (existing) {
      existing.remove();
    }

    const history =
      renderStatusHistoryV72(orderId);

    if (!history) return;

    const target =
      modal.querySelector(
        ".sod-status, .sod-body, .sod-content"
      );

    if (target) {
      target.insertAdjacentHTML(
        "afterend",
        history
      );
    } else {
      modal.insertAdjacentHTML(
        "beforeend",
        history
      );
    }
  }

  window.delyvoRenderStatusHistoryV72 =
    renderStatusHistoryV72;

  window.delyvoAddStatusHistoryV72 =
    addStatusHistoryV72;

  document.addEventListener(
    "delyvoShopOrderStatusChanged",
    function (event) {
      const orderId =
        event.detail &&
        event.detail.orderId;

      if (!orderId) return;

      setTimeout(function () {
        addStatusHistoryV72(orderId);
      }, 500);
    }
  );

  document.addEventListener(
    "delyvoShopStatusRefreshComplete",
    function () {
      const modal =
        document.getElementById(
          "delyvoShopOrderDetails"
        );

      if (!modal) return;

      const orderId =
        modal.getAttribute(
          "data-order-id"
        );

      if (orderId) {
        addStatusHistoryV72(orderId);

    return (
      window.delyvoShopOrders ||

    );

  function getPendingCountV74() {
    return getOrdersV74().filter(function (order) {
      const status =
        String(order.status || "")
          .toLowerCase()
          .trim();

      return (
        status === "pending" ||
        status === "placed"
      );
    }).length;
  }

  function playNotificationSoundV74() {
    try {
      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;

      const context =
        new AudioContext();

      const oscillator =
        context.createOscillator();

      const gain =
        context.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = 880;

      gain.gain.setValueAtTime(
        0.0001,
        context.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.15,
        context.currentTime + 0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        context.currentTime + 0.35
      );

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start();

      oscillator.stop(
        context.currentTime + 0.35
      );
    } catch (e) {
      console.warn(
        "DELYVO V74 sound unavailable:",
        e
      );
    }

<!-- DELYVO SHOP CLEAN STATUS WORKFLOW -->
<script>
(function () {
  "use strict";

  const MARKER = "DELYVO SHOP CLEAN STATUS WORKFLOW";

  const STATUS_FLOW = {
    pending: {
      next: "confirmed",
      label: "Accept Order"
    },
    placed: {
      next: "confirmed",
      label: "Accept Order"
    },
    confirmed: {
      next: "packing",
      label: "Start Packing"
    },
    packing: {
      next: "packed",
      label: "Mark Ready"
    },
    packed: {
      next: "out_for_delivery",
      label: "Send for Delivery"
    },
    out_for_delivery: {
      next: "delivered",
      label: "Mark Delivered"
    }
  };

  function normalizeStatus(status) {
    return String(status || "").toLowerCase().trim();
  }

  function getOrder(orderId) {
    const orders =
      window.delyvoShopOrders ||
      window.shopOrders ||
      [];

    return orders.find(function (order) {
      return String(order.id) === String(orderId);
    }) || null;
  }

  async function updateStatus(orderId, newStatus) {
    if (!orderId || !newStatus) return;

    if (typeof window.updateShopOrderStatus === "function") {
      return await window.updateShopOrderStatus(orderId, newStatus);
    }

    if (typeof window.delyvoUpdateOrderStatusV67 === "function") {
      return await window.delyvoUpdateOrderStatusV67(orderId, newStatus);
    }

    throw new Error("Shop order status function not available.");
  }

  function createButton(order) {
    if (!order || !order.id) return null;

    const status = normalizeStatus(order.status);
    const flow = STATUS_FLOW[status];

    if (!flow) return null;

    const button = document.createElement("button");

    button.type = "button";
    button.className = "delyvo-clean-status-btn";
    button.dataset.orderId = order.id;
    button.dataset.nextStatus = flow.next;
    button.textContent = flow.label;

    return button;
  }

  function findOrderCard(orderId) {
    const selectors = [
      '.shop-order[data-order-id="' + orderId + '"]',
      '.shop-order-card[data-order-id="' + orderId + '"]',
      '.final-shop-order[data-order-id="' + orderId + '"]',
      '[data-order-id="' + orderId + '"]'
    ];

    for (const selector of selectors) {
      const el = document.querySelector(selector);
      if (el) return el;
    }

    return null;
  }

  function connectOrderCard(card) {
    if (!card) return;

    const orderId = card.dataset.orderId;
    if (!orderId) return;

    const order = getOrder(orderId);
    if (!order) return;

    const oldButton = card.querySelector(".delyvo-clean-status-btn");
    if (oldButton) oldButton.remove();

    const button = createButton(order);
    if (!button) return;

    const wrapper =
      card.querySelector(".shop-order-actions") ||
      card.querySelector(".order-actions") ||
      card.querySelector(".shop-actions") ||
      card;

    wrapper.appendChild(button);
  }

  function connectAll() {
    const cards = document.querySelectorAll(
      ".shop-order, .shop-order-card, .final-shop-order"
    );

    cards.forEach(connectOrderCard);
  }

  document.addEventListener("click", async function (event) {
    const button = event.target.closest(".delyvo-clean-status-btn");
    if (!button) return;

    event.preventDefault();
    event.stopPropagation();

    if (button.disabled) return;

    const orderId = button.dataset.orderId;
    const nextStatus = button.dataset.nextStatus;

    if (!orderId || !nextStatus) return;

    const order = getOrder(orderId);

    if (!order) {
      alert("Order data not found. Please refresh orders.");
      return;
    }

    const flow = STATUS_FLOW[normalizeStatus(order.status)];

    if (!flow || flow.next !== nextStatus) {
      alert("Order status changed. Please refresh orders.");
      return;
    }

    button.disabled = true;
    const oldText = button.textContent;
    button.textContent = "Updating...";

    try {
      await updateStatus(orderId, nextStatus);

      document.dispatchEvent(
        new CustomEvent("delyvoCleanShopStatusChanged", {
          detail: {
            orderId: orderId,
            newStatus: nextStatus
          }
        })
      );

    } catch (error) {
      console.error("DELYVO SHOP STATUS ERROR:", error);
      alert(error.message || "Unable to update order status.");
      button.disabled = false;
      button.textContent = oldText;
    }
  });

  window.delyvoConnectCleanShopStatusWorkflow = connectAll;

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(connectAll, 1800);
    });
  } else {
    setTimeout(connectAll, 1800);
  }

  const observer = new MutationObserver(function () {
    connectAll();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  const style = document.createElement("style");
  style.id = "delyvoCleanShopStatusWorkflowStyles";
  style.textContent = `
    .delyvo-clean-status-btn {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      padding: 11px 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      background: #111827;
      color: #fff;
      transition: opacity .2s, transform .15s;
    }

    .delyvo-clean-status-btn:hover {
      opacity: .92;
      transform: translateY(-1px);
    }

    .delyvo-clean-status-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    @media (max-width: 600px) {
      .delyvo-clean-status-btn {
        min-height: 46px;
        font-size: 15px;
      }
    }
  `;

  document.head.appendChild(style);

})();
</script>
<!-- END DELYVO SHOP CLEAN STATUS WORKFLOW -->
