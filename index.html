<script>
/* =========================================================
   DELYVO CUSTOMER PRODUCT DETAIL POLISH V21
   Product detail + quantity + cart presentation
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER PRODUCT DETAIL POLISH V21";

  function getProducts() {
    return Array.isArray(window.allProducts)
      ? window.allProducts
      : (
          Array.isArray(window.delyvoLiveProducts)
            ? window.delyvoLiveProducts
            : []
        );
  }

  function findProduct(id) {
    return getProducts().find(
      p =>
        String(p.id || p.variant_id || "") === String(id) ||
        String(p.variant_id || "") === String(id)
    );
  }

  function addProductToCart(product, quantity) {
    if (
      typeof window.addToCart !==
      "function"
    ) {
      alert("Cart is not available right now.");
      return;
    }

    const qty =
      Math.max(
        1,
        Number(quantity) || 1
      );

    for (let i = 0; i < qty; i++) {
      window.addToCart(product);
    }

    if (
      typeof window.renderCart ===
      "function"
    ) {
      window.renderCart();
    }

    if (
      typeof window.updateCartCount ===
      "function"
    ) {
      window.updateCartCount();
    }
  }

  function openProductDetail(id) {
    const product =
      findProduct(id);

    if (!product) {
      return;
    }

    let modal =
      document.getElementById(
        "delyvoProductDetailV21"
      );

    if (!modal) {
      modal =
        document.createElement(
          "div"
        );

      modal.id =
        "delyvoProductDetailV21";

      modal.className =
        "delyvo-product-detail-modal-v21";

      document.body.appendChild(
        modal
      );
    }

    const price =
      Number(
        product.selling_price ??
        product.price ??
        0
      );

    const mrp =
      Number(
        product.mrp ??
        0
      );

    const name =
      String(
        product.name ||
        "Product"
      );

    const variant =
      String(
        product.variant_name ||
        product.unit ||
        ""
      );

    const stock =
      Number(
        product.stock ??
        product.stock_qty ??
        0
      );

    const image =
      product.image_url ||
      product.image ||
      "";

    const imageHtml = image
      ? `
        <img
          class="delyvo-pd-image-v21"
          src="${image}"
          alt="${name}">
      `
      : `
        <div class="delyvo-pd-image-placeholder-v21">
          🛒
        </div>
      `;

    modal.innerHTML = `
      <div
        class="delyvo-pd-backdrop-v21"
        data-pd-close-v21>
      </div>

      <div
        class="delyvo-pd-panel-v21"
        role="dialog"
        aria-modal="true">

        <button
          type="button"
          class="delyvo-pd-close-v21"
          data-pd-close-v21>
          ×
        </button>

        <div class="delyvo-pd-image-wrap-v21">
          ${imageHtml}
        </div>

        <div class="delyvo-pd-content-v21">

          <div class="delyvo-pd-name-v21">
            ${name}
          </div>

          ${
            variant
              ? `<div class="delyvo-pd-variant-v21">
                   ${variant}
                 </div>`
              : ""
          }

          <div class="delyvo-pd-price-row-v21">

            <strong>
              ₹${price.toFixed(0)}
            </strong>

            ${
              mrp > price
                ? `<span>
                     ₹${mrp.toFixed(0)}
                   </span>`
                : ""
            }

          </div>

          <div
            class="delyvo-pd-stock-v21 ${
              stock > 0
                ? "available"
                : "unavailable"
            }">

            ${
              stock > 0
                ? "In stock"
                : "Currently unavailable"
            }

          </div>

          <div class="delyvo-pd-quantity-v21">

            <button
              type="button"
              data-pd-minus-v21>
              −
            </button>

            <strong
              data-pd-qty-v21>
              1
            </strong>

            <button
              type="button"
              data-pd-plus-v21>
              +
            </button>

          </div>

          <button
            type="button"
            class="delyvo-pd-add-v21"
            data-pd-add-v21
            ${stock <= 0 ? "disabled" : ""}>
            ${
              stock > 0
                ? "Add to Cart"
                : "Out of Stock"
            }
          </button>

        </div>
      </div>
    `;

    let quantity = 1;

    const qtyBox =
      modal.querySelector(
        "[data-pd-qty-v21]"
      );

    const addButton =
      modal.querySelector(
        "[data-pd-add-v21]"
      );

    const updateQty = () => {
      if (qtyBox) {
        qtyBox.textContent =
          String(quantity);
      }
    };

    const minus =
      modal.querySelector(
        "[data-pd-minus-v21]"
      );

    if (minus) {
      minus.onclick = () => {
        quantity =
          Math.max(
            1,
            quantity - 1
          );

        updateQty();
      };
    }

    const plus =
      modal.querySelector(
        "[data-pd-plus-v21]"
      );

    if (plus) {
      plus.onclick = () => {
        const max =
          stock > 0
            ? Math.min(stock, 20)
            : 1;

        quantity =
          Math.min(
            max,
            quantity + 1
          );

        updateQty();
      };
    }

    if (addButton) {
      addButton.onclick = () => {
        if (stock <= 0) {
          return;
        }

        addProductToCart(
          product,
          quantity
        );

        modal.remove();

        if (
          typeof window.scrollTo ===
          "function"
        ) {
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }
      };
    }

    modal
      .querySelectorAll(
        "[data-pd-close-v21]"
      )
      .forEach(
        element => {
          element.onclick = () => {
            modal.remove();
          };
        }
      );

    requestAnimationFrame(() => {
      modal.classList.add(
        "open"
      );
    });
  }

  function enhanceProductCards() {
    const cards =
      document.querySelectorAll(
        ".product-card, .product, .delyvo-product-card-v13"
      );

    cards.forEach(card => {
      if (
        card.dataset
          .delyvoProductDetailV21
      ) {
        return;
      }

      const id =
        card.dataset.productId ||
        card.getAttribute(
          "data-variant-id"
        );

      if (!id) {
        return;
      }

      card.dataset
        .delyvoProductDetailV21 =
        "yes";

      card.classList.add(
        "delyvo-product-detail-card-v21"
      );

      card.addEventListener(
        "click",
        event => {
          if (
            event.target.closest(
              "button, input, a, select"
            )
          ) {
            return;
          }

          openProductDetail(id);
        }
      );
    });
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoProductDetailV21Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =
      "delyvoProductDetailV21Styles";

    style.textContent = `
      .delyvo-product-detail-card-v21 {
        cursor: pointer;
      }

      .delyvo-product-detail-modal-v21 {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
      }

      .delyvo-product-detail-modal-v21.open {
        display: block;
      }

      .delyvo-pd-backdrop-v21 {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,.45);
      }

      .delyvo-pd-panel-v21 {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -48%);
        width: min(520px, calc(100% - 24px));
        max-height: 90vh;
        overflow: auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,.22);
        padding: 18px;
      }

      .delyvo-pd-close-v21 {
        position: absolute;
        right: 10px;
        top: 8px;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 50%;
        background: #f2f2f2;
        font-size: 24px;
        cursor: pointer;
        z-index: 2;
      }

      .delyvo-pd-image-wrap-v21 {
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        border-radius: 12px;
        overflow: hidden;
      }

      .delyvo-pd-image-v21 {
        width: 100%;
        max-height: 280px;
        object-fit: contain;
      }

      .delyvo-pd-image-placeholder-v21 {
        font-size: 64px;
        padding: 50px;
      }

      .delyvo-pd-content-v21 {
        display: grid;
        gap: 10px;
        padding-top: 16px;
      }

      .delyvo-pd-name-v21 {
        font-size: 21px;
        font-weight: 800;
      }

      .delyvo-pd-variant-v21 {
        color: #666;
        font-size: 13px;
      }

      .delyvo-pd-price-row-v21 {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }

      .delyvo-pd-price-row-v21 strong {
        font-size: 24px;
      }

      .delyvo-pd-price-row-v21 span {
        color: #888;
        text-decoration: line-through;
      }

      .delyvo-pd-stock-v21 {
        font-size: 13px;
        font-weight: 700;
      }

      .delyvo-pd-stock-v21.available {
        color: #198754;
      }

      .delyvo-pd-stock-v21.unavailable {
        color: #c0392b;
      }

      .delyvo-pd-quantity-v21 {
        display: grid;
        grid-template-columns: 48px 1fr 48px;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
      }

      .delyvo-pd-quantity-v21 button {
        height: 46px;
        border: 0;
        background: #f7f7f7;
        font-size: 22px;
        cursor: pointer;
      }

      .delyvo-pd-quantity-v21 strong {
        text-align: center;
      }

      .delyvo-pd-add-v21 {
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
      }

      .delyvo-pd-add-v21:disabled {
        opacity: .55;
        cursor: not-allowed;
      }

      @media (max-width: 600px) {
        .delyvo-pd-panel-v21 {
          width: calc(100% - 16px);
          max-height: 94vh;
          border-radius: 14px;
          padding: 14px;
        }

        .delyvo-pd-image-wrap-v21 {
          min-height: 180px;
        }

        .delyvo-pd-name-v21 {
          font-size: 19px;
        }
      }
    `;

    document.head.appendChild(
      style
    );
  }

  function init() {
    injectStyles();
    enhanceProductCards();
  }

  window.delyvoOpenProductDetailV21 =
    openProductDetail;

  window.delyvoRefreshProductDetailV21 =
    init;

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(init, 1100);

      const observer =
        new MutationObserver(() => {
          enhanceProductCards();
        });

      if (document.body) {
        observer.observe(
          document.body,
          {
            childList: true,
            subtree: true
          }
        );
      }
    }
  );

  window.addEventListener(
    "load",
    () => {
      setTimeout(init, 1800);
    }
  );

  console.log(MARKER);
  console.log("Product detail : YES");
  console.log("Quantity control : YES");
  console.log("Stock display : YES");
  console.log("MRP / selling price : YES");
  console.log("Add to cart : YES");
  console.log("Mobile product detail : YES");
})();
</script>


<script>
/* =========================================================
   DELYVO CUSTOMER SERVICE AREA CHECK V22
   Modinagar 201204 service-area presentation
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER SERVICE AREA CHECK V22";

  const SERVICE_PINCODE = "201204";

  function getSelectedAddress() {
    try {
      const raw =
        localStorage.getItem(
          "delyvo_grocery_address"
        );

      return raw
        ? JSON.parse(raw)
        : null;
    } catch {
      return null;
    }
  }

  function createAreaBox() {
    let box =
      document.getElementById(
        "delyvoServiceAreaV22"
      );

    if (box) {
      return box;
    }

    box =
      document.createElement(
        "section"
      );

    box.id =
      "delyvoServiceAreaV22";

    box.className =
      "delyvo-service-area-v22";

    box.innerHTML = `
      <div class="delyvo-service-area-inner-v22">

        <div class="delyvo-service-area-icon-v22">
          📍
        </div>

        <div class="delyvo-service-area-content-v22">

          <strong>
            Delyvo Delivery Area
          </strong>

          <span>
            Currently delivering in
            Modinagar 201204
          </span>

          <small>
            Delivery fee ₹29 · Minimum order ₹199
          </small>

        </div>

        <button
          type="button"
          data-service-area-address-v22>
          Check Address
        </button>

      </div>
    `;

    return box;
  }

  function enhanceArea() {
    const existing =
      document.getElementById(
        "delyvoServiceAreaV22"
      );

    if (existing) {
      bindAreaButton(existing);
      return;
    }

    const box =
      createAreaBox();

    const products =
      document.getElementById(
        "products"
      );

    const categories =
      document.getElementById(
        "categories"
      );

    if (categories) {
      categories.parentNode.insertBefore(
        box,
        categories
      );
    } else if (products) {
      products.parentNode.insertBefore(
        box,
        products
      );
    } else if (document.body) {
      document.body.insertBefore(
        box,
        document.body.firstChild
      );
    }

    bindAreaButton(box);
  }

  function bindAreaButton(box) {
    const button =
      box.querySelector(
        "[data-service-area-address-v22]"
      );

    if (!button) {
      return;
    }

    if (
      button.dataset
        .delyvoBoundV22
    ) {
      return;
    }

    button.dataset
      .delyvoBoundV22 =
      "yes";

    button.onclick = () => {
      const address =
        getSelectedAddress();

      if (
        address &&
        String(address.pincode || "") ===
          SERVICE_PINCODE
      ) {
        alert(
          "Your selected address is inside Delyvo delivery area."
        );
        return;
      }

      if (
        typeof window.openAddressManager ===
        "function"
      ) {
        window.openAddressManager();
        return;
      }

      if (
        typeof window.openLogin ===
        "function"
      ) {
        window.openLogin();
      }
    };
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoServiceAreaV22Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =
      "delyvoServiceAreaV22Styles";

    style.textContent = `
      .delyvo-service-area-v22 {
        width: min(1100px, calc(100% - 24px));
        margin: 14px auto 20px;
      }

      .delyvo-service-area-inner-v22 {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        background: #fff;
      }

      .delyvo-service-area-icon-v22 {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #f4f4f4;
        font-size: 20px;
      }

      .delyvo-service-area-content-v22 {
        min-width: 0;
        flex: 1;
        display: grid;
        gap: 3px;
      }

      .delyvo-service-area-content-v22 strong {
        font-size: 14px;
      }

      .delyvo-service-area-content-v22 span {
        font-size: 13px;
        font-weight: 700;
      }

      .delyvo-service-area-content-v22 small {
        color: #777;
        font-size: 11px;
      }

      .delyvo-service-area-inner-v22 button {
        min-height: 40px;
        padding: 0 13px;
        border: 1px solid #ddd;
        border-radius: 9px;
        background: #fff;
        font-weight: 700;
        cursor: pointer;
        flex: 0 0 auto;
      }

      @media (max-width: 600px) {
        .delyvo-service-area-inner-v22 {
          align-items: flex-start;
        }

        .delyvo-service-area-inner-v22 button {
          min-height: 36px;
          padding: 0 10px;
          font-size: 12px;
        }

        .delyvo-service-area-content-v22 span {
          font-size: 12px;
        }
      }

      @media (max-width: 430px) {
        .delyvo-service-area-inner-v22 {
          display: grid;
          grid-template-columns: 42px 1fr;
        }

        .delyvo-service-area-inner-v22 button {
          grid-column: 1 / -1;
          width: 100%;
        }
      }
    `;

    document.head.appendChild(
      style
    );
  }

  function init() {
    injectStyles();
    enhanceArea();
  }

    init;

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(init, 1200);

      const observer =
        new MutationObserver(() => {
          enhanceArea();
        });

    try {

        localStorage.getItem(
          "delyvo_grocery_cart"
        );

        raw ? JSON.parse(raw) : [];

      return Array.isArray(cart)
        ? cart
        : [];
    } catch {
      return [];
    }
  }

  function getCartSummary() {
    const cart =
      readCart();

    let quantity = 0;
    let subtotal = 0;

    cart.forEach(item => {
      const qty =
        Math.max(
          0,
          Number(
            item.quantity || 1
          )
        );

      const price =
        Number(
          item.selling_price ??
          item.price ??
          0
        );

      quantity += qty;
      subtotal +=
        price * qty;
    });

    return {
      quantity,
      subtotal
    };

      ) ||
      document.querySelector(
        '[aria-label*="Cart" i]'
      )
    );
  }

  function openCart() {
    const button =
      getCartButton();

    if (button) {
      button.click();
      return;
    }

    if (
      typeof window.openCart ===
      "function"
    ) {
      window.openCart();
      return;
    }

      typeof window.renderCart ===
      "function"

<script>
/* =========================================================
   DELYVO CUSTOMER CART SUMMARY V26
   Delivery fee + minimum order live presentation
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER CART SUMMARY V26";

  const DELIVERY_FEE = 29;
  const MIN_ORDER = 199;

  function readCart() {
    try {
      const data =
        JSON.parse(
          localStorage.getItem(
            "delyvo_grocery_cart"
          ) || "[]"
        );

      return Array.isArray(data)
        ? data
        : [];
    } catch {
      return [];
    }
  }

  function getSummary() {
    const cart =
      readCart();

    let subtotal = 0;

    cart.forEach(item => {
      const qty =
        Math.max(
          0,
          Number(
            item.quantity || 1
          )
        );

      const price =
        Number(
          item.selling_price ??
          item.price ??
          0
        );

      subtotal +=
        price * qty;
    });

    const remaining =
      Math.max(
        0,
        MIN_ORDER - subtotal
      );

    const eligible =
      subtotal >= MIN_ORDER;

    return {
      subtotal,
      remaining,
      eligible,
      delivery:
        cart.length
          ? DELIVERY_FEE
          : 0,
      total:
        cart.length
          ? subtotal + DELIVERY_FEE
          : 0
    };
  }

  function getCartRoot() {
    return (
      document.querySelector(
        "#cartModal"

<script>
/* =========================================================
   DELYVO CUSTOMER CHECKOUT GUARD V27
   Minimum order + empty cart checkout protection
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER CHECKOUT GUARD V27";

  const MIN_ORDER = 199;

  function readCart() {
    try {
      const data =
        JSON.parse(
          localStorage.getItem(
            "delyvo_grocery_cart"
          ) || "[]"
        );

      return Array.isArray(data)
        ? data
        : [];
    } catch {
      return [];
    }
  }

  function getSubtotal() {
    return readCart().reduce(
      (sum, item) => {
        const qty =
          Math.max(
            0,
            Number(
              item.quantity || 1
            )
          );

        const price =
          Number(
            item.selling_price ??
            item.price ??
            0
          );

        return sum + price * qty;
      },
      0
    );
  }

  function getCheckoutButtons() {
    return Array.from(
      document.querySelectorAll(
        "button, a"
      )
    ).filter(
      element =>
        /checkout|place order|proceed/i.test(
          (
            element.textContent ||
            element.getAttribute("aria-label") ||
            ""
          ).trim()
        )
    );
  }

  function updateCheckoutButtons() {
    const cart =
      readCart();

    const subtotal =
      getSubtotal();

    const valid =
      cart.length > 0 &&
      subtotal >= MIN_ORDER;

    getCheckoutButtons()
      .forEach(button => {
        button.classList.add(
          "delyvo-checkout-guard-v27"
        );

        if (!valid) {
          button.classList.add(
            "delyvo-checkout-disabled-v27"
          );

          button.setAttribute(
            "aria-disabled",
            "true"
          );
        } else {
          button.classList.remove(
            "delyvo-checkout-disabled-v27"
          );

          button.setAttribute(
            "aria-disabled",
            "false"
          );
        }
      });
  }

  function validateCheckout() {
    const cart =
      readCart();

    if (cart.length === 0) {
      alert(
        "Your cart is empty. Please add products first."
      );
      return false;
    }

    const subtotal =
      getSubtotal();

    if (subtotal < MIN_ORDER) {
      const remaining =
        MIN_ORDER - subtotal;

      alert(
        `Add ₹${remaining.toFixed(0)} more. Minimum order is ₹${MIN_ORDER}.`
      );

      return false;
    }

    return true;
  }

  function handleCheckoutClick(event) {
    const target =
      event.target.closest(
        "button, a"
      );

    if (!target) {
      return;
    }

    const text =
      (
        target.textContent ||
        target.getAttribute("aria-label") ||
        ""
      ).trim();

    if (
      !/checkout|place order|proceed/i.test(
        text
      )
    ) {
      return;
    }

    if (
      !validateCheckout()
    ) {
      event.preventDefault();
      event.stopImmediatePropagation();
    }
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoCheckoutGuardV27Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =
      "delyvoCheckoutGuardV27Styles";

    style.textContent = `
      .delyvo-checkout-disabled-v27 {
        opacity: .55 !important;
        cursor: not-allowed !important;
      }

      .delyvo-checkout-guard-v27 {
        transition:
          opacity .18s ease;
      }
    `;

    document.head.appendChild(
      style
    );
  }

  function init() {
    injectStyles();
    updateCheckoutButtons();
  }

  window.delyvoValidateCheckoutV27 =
    validateCheckout;

  window.delyvoRefreshCheckoutGuardV27 =
    updateCheckoutButtons;

  document.addEventListener(
    "click",
    handleCheckoutClick,
    true
  );

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(
        init,
        1000
      );

      setInterval(
        updateCheckoutButtons,
        1000
      );
    }
  );

  window.addEventListener(
    "load",
    () => {
      setTimeout(
        updateCheckoutButtons,
        1800
      );
    }
  );

  console.log("Minimum order guard : YES");

  console.log("Existing checkout preserved : YES");
})();
</script>

<script>
/* =========================================================
   DELYVO CUSTOMER ORDER SAFETY CHECK V29
   Final pre-order validation
   Existing checkout/order logic preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER ORDER SAFETY CHECK V29";

  const MIN_ORDER = 199;
  const DELIVERY_FEE = 29;
  const SERVICE_PINCODE = "201204";

  function getToken() {
    return (
      localStorage.getItem(
        "delyvo_access_token"
      ) || ""
    );
  }

  function getCart() {
    try {
      const cart =
        JSON.parse(
          localStorage.getItem(
            "delyvo_grocery_cart"
          ) || "[]"
        );

      return Array.isArray(cart)
        ? cart
        : [];
    } catch {
      return [];
    }
  }

  function getAddress() {
    try {
      return JSON.parse(
        localStorage.getItem(
          "delyvo_grocery_address"
        ) || "null"
      );
    } catch {
      return null;
    }
  }

  function getSubtotal(cart) {
    return cart.reduce(
      (sum, item) => {
        const quantity =
          Math.max(
            0,
            Number(
              item.quantity || 1
            )
          );

        const price =
          Number(
            item.selling_price ??
            item.price ??
            0
          );

        return (
          sum +
          price * quantity
        );
      },
      0
    );
  }

  function validateOrder() {
    if (!getToken()) {
      return {
        ok: false,
        message:
          "Please login before placing the order."
      };
    }

    const cart =
      getCart();

    if (!cart.length) {
      return {
        ok: false,
        message:
          "Your cart is empty."
      };
    }

    const address =
      getAddress();

    if (!address) {
      return {
        ok: false,
        message:
          "Please select a delivery address."
      };
    }

    if (
      String(
        address.pincode || ""
      ).trim() !==
      SERVICE_PINCODE
    ) {
      return {
        ok: false,
        message:
          "Delivery is currently available only in Modinagar 201204."
      };
    }

    const subtotal =
      getSubtotal(cart);

    if (subtotal < MIN_ORDER) {
      return {
        ok: false,
        message:
          `Minimum order is ₹${MIN_ORDER}. Add ₹${(MIN_ORDER - subtotal).toFixed(0)} more.`
      };
    }

    return {
      ok: true,
      subtotal,
      deliveryFee:
        DELIVERY_FEE,
      total:
        subtotal +
        DELIVERY_FEE,
      address,
      cart
    };
  }

  function showValidation(result) {
    if (!result.ok) {
      alert(
        result.message
      );
    }

    return result.ok;
  }

  const originalCheckout =
    window.finalDelyvoCheckout;

  function connectCheckout() {
    if (
      typeof originalCheckout !==
      "function"
    ) {
      return false;
    }

    if (
      window.__delyvoV29CheckoutConnected
    ) {
      return true;
    }

    window.finalDelyvoCheckout =
      async function (...args) {
        const result =
          validateOrder();

        if (!showValidation(result)) {
          return null;
        }

        return await originalCheckout.apply(
          this,
          args
        );
      };

    window.__delyvoV29CheckoutConnected =
      true;

    return true;
  }

  window.delyvoValidateOrderSafetyV29 =
    validateOrder;

  window.delyvoGetOrderSafetyV29 =
    function () {
      return validateOrder();
    };

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      connectCheckout();

      let attempts = 0;

      const timer =
        setInterval(() => {
          attempts++;

          if (
            connectCheckout() ||
            attempts >= 20
          ) {
            clearInterval(timer);
          }
        }, 250);
    }
  );

  console.log(MARKER);
  console.log("Login validation : YES");
  console.log("Cart validation : YES");
  console.log("Address validation : YES");
  console.log("Pincode 201204 validation : YES");
  console.log("Minimum order ₹199 validation : YES");
  console.log("COD checkout preserved : YES");
  console.log("Existing checkout preserved : YES");
})();
</script>


<script>
/* =========================================================
   DELYVO CUSTOMER ORDER STATUS POLISH V30
   Clear order status labels + visual status badges
   Existing order timeline preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER ORDER STATUS POLISH V30";

  function normalizeStatus(status) {
    return String(
      status || ""
    )
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "_");
  }

  function statusLabel(status) {
    const map = {
      placed:
        "Order Received",
      pending:
        "Order Received",
      confirmed:
        "Order Confirmed",
      packing:
        "Packing",
      packed:
        "Ready",
      out_for_delivery:
        "Out for Delivery",
      delivered:
        "Delivered",
      cancelled:
        "Cancelled",
      refunded:
        "Refunded"
    };

    return (
      map[
        normalizeStatus(status)
      ] ||
      status ||
      "Order Status"
    );
  }

  function statusClass(status) {
    const value =
      normalizeStatus(
        status
      );

    if (
      value === "delivered"
    ) {
      return "delivered";
    }

    if (
      value === "cancelled" ||
      value === "refunded"
    ) {
      return "cancelled";
    }

    if (
      value ===
      "out_for_delivery"
    ) {
      return "delivery";
    }

    if (
      value === "packing" ||
      value === "packed"
    ) {
      return "preparing";
    }

    return "active";
  }

  function enhanceCurrentStatus() {
    const elements =
      document.querySelectorAll(
        ".od-current strong, .od-status, [data-order-status]"
      );

    elements.forEach(
      element => {
        const raw =
          element.getAttribute(
            "data-order-status"
          ) ||
          element.textContent ||
          "";

        const normalized =
          normalizeStatus(
            raw
          );

        if (
          !normalized
        ) {
          return;
        }

        element.classList.add(
          "delyvo-order-status-v30"
        );

        element.classList.remove(
          "active",
          "preparing",
          "delivery",
          "delivered",
          "cancelled"
        );

        element.classList.add(
          statusClass(
            normalized
          )
        );

        if (
          !element.dataset
            .delyvoStatusLabelled
        ) {
          const label =
            statusLabel(
              normalized
            );

          if (
            element.textContent.trim() !==
            label
          ) {
            element.textContent =
              label;
          }

          element.dataset
            .delyvoStatusLabelled =
            "true";
        }
      }
    );
  }

  function enhanceOrderCards() {
    const cards =
      document.querySelectorAll(
        ".mo-order, .order-card, .delyvo-order-card-v12"
      );

    cards.forEach(
      card => {
        card.classList.add(
          "delyvo-order-status-card-v30"
        );

        const text =
          (
            card.textContent ||
            ""
          ).toLowerCase();

        let status = "";

        if (
          text.includes(
            "out for delivery"
          )
        ) {
          status =
            "out_for_delivery";
        } else if (
          text.includes(
            "delivered"
          )
        ) {
          status =
            "delivered";
        } else if (
          text.includes(
            "cancelled"
          )
        ) {
          status =
            "cancelled";
        } else if (
          text.includes(
            "refunded"
          )
        ) {
          status =
            "refunded";
        } else if (
          text.includes(
            "packing"
          )
        ) {
          status =
            "packing";
        } else if (
          text.includes(
            "ready"
          )
        ) {
          status =
            "packed";
        } else if (
          text.includes(
            "confirmed"
          )
        ) {
          status =
            "confirmed";
        } else if (
          text.includes(
            "order received"
          ) ||
          text.includes(
            "pending"
          )
        ) {
          status =
            "pending";
        }

        if (!status) {
          return;
        }

        card.classList.remove(
          "status-active-v30",
          "status-preparing-v30",
          "status-delivery-v30",
          "status-delivered-v30",

        card.classList.add(

          badge.className =
            "delyvo-status-badge-v30";

          card.prepend(
            badge

        badge.textContent =

            status

    );

  function injectStyles() {

<script>
/* =========================================================
   DELYVO CUSTOMER MY ORDERS FILTER V32
   Search + status filters for customer order history
   Existing order actions preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER MY ORDERS FILTER V32";

  let currentFilter = "all";
  let currentSearch = "";

  function normalize(value) {
    return String(
      value || ""
    )
      .trim()
      .toLowerCase();
  }

  function getCards() {
    return Array.from(
      document.querySelectorAll(
        ".mo-order, .order-card, .delyvo-order-card-v12"
      )
    );
  }

  function getStatus(card) {
    const text =
      normalize(
        card.textContent
      );

    if (
      text.includes(
        "cancelled"
      )
    ) {
      return "cancelled";
    }

    if (
      text.includes(
        "refunded"
      )
    ) {
      return "cancelled";
    }

    if (
      text.includes(
        "delivered"
      )
    ) {
      return "delivered";
    }

    return "active";
  }

  function applyFilter() {
    const cards =
      getCards();

    let visible =
      0;

    cards.forEach(card => {
      const text =
        normalize(
          card.textContent
        );

      const status =
        getStatus(card);

      const matchesSearch =
        !currentSearch ||
        text.includes(
          currentSearch
        );

      const matchesFilter =
        currentFilter === "all" ||
        (
          currentFilter ===
            "active" &&
          status === "active"
        ) ||
        (
          currentFilter ===
            "delivered" &&
          status === "delivered"
        ) ||
        (
          currentFilter ===
            "cancelled" &&
          status === "cancelled"
        );

      const show =
        matchesSearch &&
        matchesFilter;

      card.style.display =
        show ? "" : "none";

      if (show) {
        visible++;
      }
    });

    const count =
      document.getElementById(
        "delyvoMyOrdersCountV32"
      );

    if (count) {
      count.textContent =
        `${visible} order${visible === 1 ? "" : "s"}`;
    }

    const empty =
      document.getElementById(
        "delyvoMyOrdersEmptyV32"
      );

    if (empty) {
      empty.style.display =
        visible === 0

    const firstChild =
      root.firstElementChild;

    if (firstChild) {
      root.insertBefore(
        controls,

    } else {

    const search =
      controls.querySelector(

    if (search) {
      search.addEventListener(

    controls

<script>
/* =========================================================
   DELYVO CUSTOMER REORDER V33
   Reorder previous order items into cart
   Existing cart/order logic preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER REORDER V33";

  function getToken() {
    return (
      localStorage.getItem(
        "delyvo_access_token"
      ) || ""
    );
  }

  function getHeaders() {
    const key =
      "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

    const token =
      getToken();

    return {
      apikey: key,
      Authorization:
        "Bearer " + token
    };
  }

  async function getOrderItems(orderId) {
    const url =
      "https://unwdkreujyejgcucgttj.supabase.co" +
      "/rest/v1/order_items" +
      "?select=id,product_id,variant_id,product_name,variant_name,quantity,unit_price,total" +
      "&order_id=eq." +
      encodeURIComponent(orderId) +
      "&order=id";

    const response =
      await fetch(
        url,
        {
          headers:
            getHeaders()
        }
      );

    if (!response.ok) {
      throw new Error(
        "Unable to load order items."
      );
    }

    const data =
      await response.json();

    return Array.isArray(data)
      ? data
      : [];
  }

  function addItemToExistingCart(item) {
    let cart = [];

    try {
      cart =
        JSON.parse(
          localStorage.getItem(
            "delyvo_grocery_cart"
          ) || "[]"
        );

      if (!Array.isArray(cart)) {
        cart = [];
      }
    } catch {
      cart = [];
    }

    const variantId =
      item.variant_id ||
      item.id;

    const existing =
      cart.find(
        cartItem =>
          String(
            cartItem.variant_id ||
            cartItem.id ||
            ""
          ) ===
          String(
            variantId
          )
      );

    const quantity =
      Math.max(
        1,
        Number(
          item.quantity || 1
        )
      );

    if (existing) {
      existing.quantity =
        Math.max(
          1,
          Number(
            existing.quantity ||
            0
          )
        ) + quantity;
    } else {
      cart.push({
        id:
          variantId,
        variant_id:
          item.variant_id ||
          variantId,
        product_id:
          item.product_id ||
          null,
        name:
          item.product_name ||
          "Product",
        variant_name:
          item.variant_name ||
          "",
        price:
          Number(
            item.unit_price || 0
          ),
        selling_price:
          Number(
            item.unit_price || 0
          ),
        mrp:
          Number(
            item.unit_price || 0
          ),
        quantity:
          quantity
      });
    }

    localStorage.setItem(
      "delyvo_grocery_cart",
      JSON.stringify(cart)
    );

    return true;
  }

  async function reorder(orderId) {
    if (!getToken()) {
      if (
        typeof window.openLogin ===
        "function"
      ) {
        window.openLogin();
      } else {
        alert(
          "Please login first."
        );
      }

      return false;
    }

    if (!orderId) {
      alert(
        "Order ID not found."
      );

      return false;
    }

    try {
      const items =
        await getOrderItems(
          orderId
        );

      if (!items.length) {
        alert(
          "No products found in this order."
        );

        return false;
      }

      items.forEach(
        addItemToExistingCart
      );

      if (
        typeof window.updateCartCount ===
        "function"
      ) {
        window.updateCartCount();
      }

      if (
        typeof window.renderCart ===
        "function"
      ) {
        window.renderCart();
      }

      if (
        typeof window.delyvoRefreshStickyCartV25 ===
        "function"
      ) {
        window.delyvoRefreshStickyCartV25();
      }

      if (
        typeof window.delyvoRefreshCartSummaryV26 ===
        "function"
      ) {
        window.delyvoRefreshCartSummaryV26();
      }

      alert(
        `${items.length} product${items.length === 1 ? "" : "s"} added to cart.`
      );

      return true;
    } catch (error) {
      console.error(
        "DELYVO REORDER ERROR:",
        error
      );

      alert(
        "Unable to reorder this order right now."
      );

      return false;
    }
  }

  function getCurrentOrderId(root) {
    if (!root) {
      return "";
    }

    return (
      root.getAttribute(
        "data-order-id"
      ) ||
      root.dataset.orderId ||
      window.activeOrderId ||
      ""
    );
  }

  function addReorderButton() {
    const roots =
      document.querySelectorAll(
        "#orderDetailsModal, .order-details-modal, .od-card, [data-order-details]"
      );

    roots.forEach(root => {
      if (
        root.querySelector(
          ".delyvo-reorder-btn-v33"
        )
      ) {
        return;
      }

      const orderId =
        getCurrentOrderId(
          root
        );

      if (!orderId) {
        return;
      }

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "delyvo-reorder-btn-v33";

      button.textContent =
        "Reorder";

      button.addEventListener(
        "click",
        () => {
          reorder(
            orderId
          );
        }
      );

      const actions =
        root.querySelector(
          ".od-actions, .order-actions, .od-footer, .modal-actions"
        );

      if (actions) {
        actions.appendChild(
          button
        );
      } else {
        root.appendChild(
          button
        );
      }
    });
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoReorderV33Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =

    style.textContent = `
      .delyvo-reorder-btn-v33 {
        width: 100%;

<script>
/* =========================================================
   DELYVO CUSTOMER ACCOUNT PANEL TOGGLE V41
   Reliable account panel open/close toggle
   Existing authentication preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER ACCOUNT PANEL TOGGLE V41";

  function getPanel() {
    return document.getElementById(
      "delyvoAccountPanelV35"
    );
  }

  function isOpen(panel) {
    if (!panel) return false;

    return (
      panel.style.display !== "none" &&
      getComputedStyle(panel).display !==
        "none"
    );
  }

  function openPanel() {
    const panel = getPanel();

    if (!panel) return false;

    panel.style.display = "block";
    panel.setAttribute(
      "aria-hidden",
      "false"
    );

    return true;
  }

  function closePanel() {
    const panel = getPanel();

    if (!panel) return false;

    panel.style.display = "none";
    panel.setAttribute(
      "aria-hidden",
      "true"
    );

    return true;
  }

  function togglePanel() {
    const panel = getPanel();

    if (!panel) {
      if (
        typeof window.delyvoRefreshAccountPanelV35 ===
        "function"
      ) {
        window.delyvoRefreshAccountPanelV35();
      }

      return false;
    }

    if (isOpen(panel)) {
      closePanel();
    } else {
      openPanel();
    }

    return true;
  }

  window.delyvoOpenAccountPanelV41 =
    openPanel;

  window.delyvoCloseAccountPanelV41 =
    closePanel;

  window.delyvoToggleAccountPanelV41 =
    togglePanel;

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      const panel = getPanel();

      if (panel) {
        panel.setAttribute(
          "aria-hidden",
          "true"
        );
      }
    }
  );

  console.log("Account open : YES");
  console.log("Account close : YES");

})();

<script>
/* =========================================================
   DELYVO CUSTOMER ORDER EVENT BRIDGE V53
   Connect order placement/cancellation with V52 events
   Existing checkout/cancel functions preserved
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER ORDER EVENT BRIDGE V53";

  let checkoutConnected = false;
  let cancelConnected = false;

  function emit(name, detail = {}) {
    try {
      document.dispatchEvent(
        new CustomEvent(
          name,
          { detail }
        )
      );
    } catch (error) {
      console.warn(
        "DELYVO EVENT ERROR:",
        error
      );
    }
  }

  function connectCheckout() {
    if (
      checkoutConnected ||
      typeof window.finalDelyvoCheckout !==
        "function"
    ) {
      return;
    }

    const original =
      window.finalDelyvoCheckout;

    window.finalDelyvoCheckout =
      async function(...args) {
        const result =
          await original.apply(
            this,
            args
          );

        emit(
          "delyvoOrderPlaced",
          {
            order: result || null
          }

<script>

  function calculateCartV61() {
    const cart = getCartV61();

    let subtotal = 0;

    cart.forEach(function (item) {
      const price = Number(
        item.selling_price ??
        item.price ??
        item.unit_price ??
        0
      );

      const quantity = Math.max(
        1,
        Number(item.quantity || 1)
      );

      subtotal += price * quantity;
    });

    const deliveryFee = subtotal > 0 ? 29 : 0;
    const total = subtotal + deliveryFee;

    return {
      items: cart,
      subtotal: subtotal,
      deliveryFee: deliveryFee,
      total: total,
      minimumOrder: 199,

<script>
(function () {
  "use strict";

  let selectedCategory = "";

  function getProducts() {
    return Array.isArray(window.delyvoLiveProducts)
      ? window.delyvoLiveProducts
      : (Array.isArray(window.allProducts) ? window.allProducts : []);
  }

  function getCategories() {
    return Array.isArray(window.delyvoLiveCategories)
      ? window.delyvoLiveCategories
      : (Array.isArray(window.allCategories) ? window.allCategories : []);
  }

  function normalize(value) {
    return String(value || "")
      .toLowerCase()
      .trim();
  }

  function productMatchesCategory(product, category) {
    if (!category) return true;

    const wanted = normalize(category);

    const values = [
      product.category,
      product.category_name,
      product.categoryName,
      product.category_slug,
      product.category_id,
      product.categoryId
    ];

    return values.some(function (value) {
      const current = normalize(value);

      if (!current) return false;

      return (
        current === wanted ||
        current.includes(wanted) ||
        wanted.includes(current)
      );
    });
  }

  function renderCategoryProducts(category) {
    const products = getProducts();

    if (!category) {
      if (typeof window.renderProducts === "function") {
        window.renderProducts(products);
      }
      return;
    }

    const filtered = products.filter(function (product) {
      return productMatchesCategory(product, category);
    });

    if (typeof window.renderProducts === "function") {
      window.renderProducts(filtered);
    }

    window.delyvoSelectedCategory =
      category;
  }

  function connectCategories() {
    const categories = getCategories();

    if (!categories.length) return;

    const boxes = document.querySelectorAll(
      "#categories > *, #categories .category, #categories .category-card, #categories button, #categories [data-category]"
    );

    boxes.forEach(function (box, index) {
      if (box.dataset.delyvoCategoryConnected === "yes") {
        return;
      }

      let categoryName =
        box.dataset.category ||
        box.dataset.categoryName ||
        box.getAttribute("data-name") ||
        "";

      if (!categoryName && categories[index]) {
        categoryName =
          categories[index].name ||
          categories[index].title ||
          categories[index].slug ||
          "";
      }

      if (!categoryName) return;

      box.dataset.delyvoCategoryConnected = "yes";
      box.dataset.delyvoCategoryValue = categoryName;

      box.addEventListener("click", function (event) {
        event.preventDefault();

        const clickedCategory =
          box.dataset.delyvoCategoryValue || "";

        if (
          selectedCategory &&
          normalize(selectedCategory) === normalize(clickedCategory)
        ) {
          selectedCategory = "";

          document.querySelectorAll(
            "#categories [data-delyvo-category-connected]"
          ).forEach(function (item) {
            item.classList.remove(
              "delyvo-category-selected"
            );
          });

          renderCategoryProducts("");
          return;
        }

        selectedCategory = clickedCategory;

        document.querySelectorAll(
          "[data-delyvo-category-connected]"
        ).forEach(function (item) {
          item.classList.remove(
            "delyvo-category-selected"
          );
        });

        box.classList.add(
          "delyvo-category-selected"
        );

        renderCategoryProducts(
          clickedCategory
        );
      });
    });
  }

  window.delyvoFilterProductsByCategory =
    function (category) {
      selectedCategory = category || "";
      renderCategoryProducts(
        selectedCategory
      );
    };

  window.delyvoClearCategoryFilter =
    function () {
      selectedCategory = "";

      document.querySelectorAll(
        ".delyvo-category-selected"
      ).forEach(function (item) {
        item.classList.remove(
          "delyvo-category-selected"
        );
      });

      renderCategoryProducts("");
    };

  const observer =
    new MutationObserver(function () {
      connectCategories();
    });

  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

  document.addEventListener(
    "DOMContentLoaded",
    function () {
      setTimeout(
        connectCategories,
        1800
      );
    }
  );

  window.delyvoConnectCategoryProducts =
    connectCategories;

  console.log(
    "DELYVO CUSTOMER CATEGORY PRODUCT CONNECTION READY"
  );
})();
</script>

<!-- DELYVO CUSTOMER CHECKOUT FINAL CLEAN CONNECTION -->
<script>
(function () {
  "use strict";

  const DELIVERY_FEE = 29;
  const MIN_ORDER = 199;
  const PINCODE = "201204";

  function getToken() {
    return localStorage.getItem("delyvo_access_token") || "";
  }

  function getCart() {
    try {
      const cart = JSON.parse(
        localStorage.getItem("delyvo_grocery_cart") || "[]"
      );
      return Array.isArray(cart) ? cart : [];
    } catch (e) {
      return [];
    }
  }

  function getSelectedAddress() {
    try {
      return JSON.parse(
        localStorage.getItem("delyvo_grocery_address") || "null"
      );
    } catch (e) {
      return null;
    }
  }

  function money(value) {
    return "₹" + Number(value || 0).toFixed(0);
  }

  function getSubtotal() {
    return getCart().reduce(function (sum, item) {
      return sum + (
        Number(
          item.selling_price ??
          item.price ??
          0
        ) * Number(item.quantity || 0)
      );
    }, 0);
  }

  function validateCheckout() {
    const cart = getCart();

    if (!getToken()) {
      return {
        ok: false,
        message: "Please login before checkout."
      };
    }

    if (!cart.length) {
      return {
        ok: false,
        message: "Your cart is empty."
      };
    }

    const subtotal = getSubtotal();

    if (subtotal < MIN_ORDER) {
      return {
        ok: false,
        message:
          "Minimum order value is " +
          money(MIN_ORDER) +
          ". Add " +
          money(MIN_ORDER - subtotal) +
          " more."
      };
    }

    const address = getSelectedAddress();

    if (!address || !address.id) {
      return {
        ok: false,
        message: "Please select a delivery address."
      };
    }

    if (
      String(address.pincode || "").trim() !==
      PINCODE
    ) {
      return {
        ok: false,
        message:
          "Delivery is currently available only in " +
          PINCODE +
          "."
      };
    }

    return {
      ok: true,
      cart: cart,
      address: address,
      subtotal: subtotal,
      delivery: DELIVERY_FEE,
      total: subtotal + DELIVERY_FEE
    };
  }

  function findCheckoutRoot() {
    return (
      document.querySelector("#checkoutModal") ||
      document.querySelector(".checkout-modal") ||
      document.querySelector("[data-checkout-modal]") ||
      document.querySelector(".checkout")
    );
  }

  function renderCleanCheckout() {
    const root = findCheckoutRoot();

    if (!root) return;

    let box = root.querySelector(
      ".delyvo-clean-checkout-connection"
    );

    if (!box) {
      box = document.createElement("div");
      box.className =
        "delyvo-clean-checkout-connection";

      root.appendChild(box);
    }

    const state = validateCheckout();

    if (!state.ok) {
      box.innerHTML =
        '<div class="dcc-error">' +

      out_for_delivery:
        "Out for Delivery",

      refunded: "Refunded"
    };

    return (
      map[status] ||
      status ||
      "Order"
    );
  }

  function rememberOrder(orderId) {
    if (!orderId) return;

    activeOrderId = String(orderId);

    try {
      sessionStorage.setItem(
        "delyvo_active_order",
        String(orderId)
      );
    } catch (e) {}
  }

  function restoreOrder() {
    if (activeOrderId) {
      return activeOrderId;
    }

    try {
      return sessionStorage.getItem(
        "delyvo_active_order"
      );
    } catch (e) {
      return null;
    }
  }

  async function refreshOrderDetails(orderId) {
    if (!orderId) return;

    rememberOrder(orderId);

    if (
      typeof window.openOrderDetails ===
      "function"
    ) {
      try {
        await window.openOrderDetails(
          orderId
        );
        return;
      } catch (e) {
        console.warn(
          "DELYVO ORDER DETAILS REFRESH:",
          e
        );
      }
    }
  }

  function connectOrderCards() {
    document
      .querySelectorAll(
        ".mo-order, .order-card, [data-order-id]"
      )
      .forEach(function (card) {
        if (
          card.dataset.delyvoOrdersConnected ===
          "yes"
        ) {
          return;
        }

        let orderId =
          card.getAttribute(
            "data-order-id"
          ) ||
          card.dataset.orderId;

        if (!orderId) {
          const details =
            card.querySelector(
              "[onclick*='openOrderDetails']"
            );

          if (details) {
            const match =
              String(
                details.getAttribute(
                  "onclick"
                ) || ""
              ).match(
                /openOrderDetails\(['"]([^'"]+)['"]/
              );

            if (match) {
              orderId = match[1];
            }
          }
        }

        if (!orderId) return;

        card.dataset.orderId =
          orderId;

        card.dataset
          .delyvoOrdersConnected =
          "yes";

        card.addEventListener(
          "click",
          function (event) {
            const action =
              event.target.closest(
                "button, a, input, select"
              );

            if (action) return;

            rememberOrder(orderId);
          }
        );
      });

            ".view-order-details, " +

        const orderId =
          card.getAttribute(
            "data-order-id"
          );

        if (orderId) {
          rememberOrder(orderId);
        }

        setTimeout(
          connectOrderCards,
          200
        );
      }
    );
  }

  window.delyvoRefreshMyOrdersConnection =
    function () {
      connectOrderCards();

      const orderId =

      if (orderId) {
        activeOrderId =

      }

        );
      }

    };
