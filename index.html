<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delyvo Grocery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div>
      <h1>DELYVO</h1>
      <p>Fresh groceries, delivered.</p>
    </div>

    <div class="header-actions">
      <button id="myOrdersBtn" class="secondary-btn">My Orders</button>
  <button id="loginBtn" class="secondary-btn">Login</button>
      <button id="cartBtn">
        🛒 <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  
<div id="authModal" class="modal">
  <div class="modal-card">
    <div class="drawer-head">
      <h2 id="authTitle">Delyvo Login</h2>
      <button class="close-btn" onclick="closePanel('authModal')">×</button>
    </div>

    <form id="authForm">
      <input id="authEmail" type="email" placeholder="Email" required>
      <input id="authPassword" type="password" placeholder="Password" required>
      <button class="primary-btn" type="submit">Login</button>
    </form>

    <p id="authMessage"></p>

    <button id="signupBtn" class="secondary-btn" type="button">
      New customer? Create account
    </button>
  </div>
</div>

<main>
    <section id="locationBtn" class="location">
      <span>📍</span>
      <div>
        <small>Deliver to</small>
        <strong id="locationText">Select your location</strong>
      </div>
    </section>

    <section class="search">
      <input
        id="searchInput"
        type="search"
        placeholder="Search groceries..."
      >
    </section>

    <section>
      <div class="section-title">
        <h2>Categories</h2>
      </div>

      <div id="categories" class="categories">
        <p>Loading categories...</p>
      </div>
    </section>

    <section>
      <div class="section-title">
        <h2>Popular products</h2>
      </div>

      <div id="products" class="products">
        <p>Loading products...</p>
      </div>
    </section>
  </main>

  
<div id="cartPanel" class="drawer">
  <div class="drawer-head">
    <h2>Your Cart</h2>
    <button class="close-btn" onclick="closePanel('cartPanel')">×</button>
  </div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-footer">
    <div><span>Subtotal</span><b id="cartSubtotal">₹0</b></div>
    <div><span>Delivery</span><b>FREE</b></div>
    <div class="cart-total"><span>Total</span><b id="cartTotal">₹0</b></div>
    <button class="primary-btn" onclick="openCheckout()">Proceed to Checkout</button>
  </div>
</div>

<div id="checkoutModal" class="modal">
  <div class="modal-card">
    <div class="drawer-head">
      <h2>Checkout</h2>
      <button class="close-btn" onclick="closePanel('checkoutModal')">×</button>
    </div>

    <div id="checkoutSummary" class="checkout-summary"></div>

    <div class="payment-box">
      <b>Payment Method</b>
      <p>Cash on Delivery</p>
    </div>

    <button class="primary-btn" onclick="placeOrder()">Place Order</button>
  </div>
</div>

<script src="app.js"></script>

<script>
(() => {
  function showDelyvoOrderSuccess(order) {
    let old = document.getElementById("delyvoOrderSuccess");
    if (old) old.remove();

    const modal = document.createElement("div");
    modal.id = "delyvoOrderSuccess";

    modal.innerHTML = `
      <div class="dos-backdrop"></div>

      <div class="dos-card">
        <div class="dos-check">✓</div>

        <h2>Order Placed Successfully</h2>

        <p class="dos-thanks">
          Thank you for shopping with Delyvo.
        </p>

        <div class="dos-order">
          <span>Order Number</span>
          <strong>${escapeHtml(order.order_number || "")}</strong>
        </div>

        <div class="dos-row">
          <span>Subtotal</span>
          <strong>₹${Number(order.subtotal || 0).toFixed(0)}</strong>
        </div>

        <div class="dos-row">
          <span>Delivery Fee</span>
          <strong>₹${Number(order.delivery_fee || 0).toFixed(0)}</strong>
        </div>

        <div class="dos-total">
          <span>Total</span>
          <strong>₹${Number(order.total || 0).toFixed(0)}</strong>
        </div>

        <div class="dos-cod">
          💵 Cash on Delivery
        </div>

        <button class="dos-primary" id="dosContinue">
          Continue Shopping
        </button>

        <button class="dos-secondary" id="dosOrders">
          My Orders
        </button>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById("dosContinue").onclick = () => {
      modal.remove();
      window.scrollTo({top: 0, behavior: "smooth"});
    };

    document.getElementById("dosOrders").onclick = () => {
      modal.remove();

      if (typeof window.openMyOrders === "function") {
        window.openMyOrders();
      } else {
        alert("My Orders section next update mein available hoga.");
      }
    };
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.showDelyvoOrderSuccess = showDelyvoOrderSuccess;

  const style = document.createElement("style");

  style.textContent = `
    #delyvoOrderSuccess {
      position:fixed;
      inset:0;
      z-index:99999;
    }

    .dos-backdrop {
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.55);
    }

    .dos-card {
      position:relative;
      z-index:2;
      width:min(92%,430px);
      box-sizing:border-box;
      margin:8vh auto 0;
      padding:28px;
      background:#fff;
      border-radius:22px;
      box-shadow:0 15px 50px rgba(0,0,0,.25);
      text-align:center;
    }

    .dos-check {
      width:68px;
      height:68px;
      margin:0 auto 15px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#dff7e4;
      color:#11852e;
      font-size:38px;
      font-weight:800;
    }

    .dos-card h2 {
      margin:0;
      font-size:24px;
    }

    .dos-thanks {
      color:#777;
      margin:8px 0 22px;
    }

    .dos-order {
      padding:14px;
      border-radius:12px;
      background:#f7f7f7;
      margin-bottom:15px;
    }

    .dos-order span {
      display:block;
      color:#777;
      font-size:13px;
      margin-bottom:5px;
    }

    .dos-order strong {
      font-size:19px;
    }

    .dos-row,
    .dos-total {
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:8px 0;
    }

    .dos-row {
      color:#666;
    }

    .dos-total {
      margin-top:8px;
      padding-top:14px;
      border-top:1px solid #eee;
      font-size:18px;
    }

    .dos-cod {
      margin:18px 0;
      padding:12px;
      border-radius:10px;
      background:#fff7df;
      color:#7b5a00;
      font-weight:700;
    }

    .dos-primary,
    .dos-secondary {
      width:100%;
      padding:12px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
    }

    .dos-primary {
      border:0;
      background:#111;
      color:#fff;
    }

    .dos-secondary {
      margin-top:9px;
      border:1px solid #ddd;
      background:#fff;
      color:#222;
    }
  `;

  document.head.appendChild(style);
})();
</script>


<script>
(() => {
  const SUPABASE_URL = "https://unwdkreujyejgcucgttj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

  function customerToken() {
    return localStorage.getItem("delyvo_access_token") || "";
  }

  async function customerApi(path) {
    const token = customerToken();

    if (!token) {
      throw new Error("Please login first.");
    }

    const response = await fetch(
      SUPABASE_URL + path,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + token
        }
      }
    );

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.msg ||
        "Unable to load orders"
      );
    }

    return data;
  }

  function orderStatusLabel(status) {
    const labels = {
      placed: "ORDER RECEIVED",
      pending: "ORDER RECEIVED",
      confirmed: "CONFIRMED",
      packing: "PACKING",
      packed: "READY",
      out_for_delivery: "OUT FOR DELIVERY",
      delivered: "DELIVERED",
      cancelled: "CANCELLED",
      refunded: "REFUNDED"
    };

    return labels[status] ||
      String(status || "").replaceAll("_", " ").toUpperCase();
  }

  function openMyOrders() {
    let old = document.getElementById("delyvoMyOrders");
    if (old) old.remove();

    const modal = document.createElement("div");
    modal.id = "delyvoMyOrders";

    modal.innerHTML = `
      <div class="mo-backdrop"></div>

      <div class="mo-card">
        <div class="mo-head">
          <div>
            <h2>My Orders</h2>
            <p>Your Delyvo grocery orders</p>
          </div>

          <button class="mo-close" id="moClose">×</button>
        </div>

        <div id="moOrdersList">
          <p class="mo-loading">Loading orders...</p>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    document.getElementById("moClose").onclick =
      () => modal.remove();

    loadMyOrders();
  }

  async function loadMyOrders() {
    const box = document.getElementById("moOrdersList");

    if (!box) return;

    try {
      const orders = await customerApi(
        "/rest/v1/orders" +
        "?select=id,order_number,status,payment_status,subtotal,delivery_fee,total,created_at" +
        "&order=created_at.desc"
      );

      if (!orders.length) {
        box.innerHTML = `
          <div class="mo-empty">
            <div>🛍️</div>
            <strong>No orders yet</strong>
            <p>Your orders will appear here.</p>
          </div>
        `;
        return;
      }

      box.innerHTML = "";

      orders.forEach(order => {
        const card = document.createElement("div");
        card.className = "mo-order";

        card.innerHTML = `
          <div class="mo-order-top">
            <div>
              <strong>${escapeHtml(order.order_number)}</strong>
              <small>${formatDate(order.created_at)}</small>
            </div>

            <span class="mo-status mo-${escapeHtml(order.status)}">
              ${orderStatusLabel(order.status)}
            </span>
          </div>

          <div class="mo-details">
            <div>
              <span>Subtotal</span>
              <strong>₹${Number(order.subtotal || 0).toFixed(0)}</strong>
            </div>

            <div>
              <span>Delivery</span>
              <strong>₹${Number(order.delivery_fee || 0).toFixed(0)}</strong>
            </div>

            <div>
              <span>Total</span>
              <strong>₹${Number(order.total || 0).toFixed(0)}</strong>
            </div>
          </div>

          <div class="mo-payment">
            <span>Payment: ${escapeHtml(
              order.payment_status || "pending"
            ).toUpperCase()}</span>

            <span>Cash on Delivery</span>
          </div>
        `;

        box.appendChild(card);
      });

    } catch (e) {
      box.innerHTML = `
        <div class="mo-error">
          ${escapeHtml(e.message)}
        </div>
      `;
    }
  }

  function formatDate(value) {
    try {
      return new Date(value).toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    } catch {
      return "";
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.openMyOrders = openMyOrders;

  const style = document.createElement("style");

  style.textContent = `
    #delyvoMyOrders {
      position:fixed;
      inset:0;
      z-index:99998;
    }

    .mo-backdrop {
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.55);
    }

    .mo-card {
      position:relative;
      z-index:2;
      width:min(94%,700px);
      max-height:86vh;
      overflow:auto;
      box-sizing:border-box;
      margin:7vh auto 0;
      padding:22px;
      background:#fff;
      border-radius:20px;
      box-shadow:0 15px 50px rgba(0,0,0,.25);
    }

    .mo-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      margin-bottom:18px;
    }

    .mo-head h2 {
      margin:0;
    }

    .mo-head p {
      margin:4px 0 0;
      color:#777;
    }

    .mo-close {
      width:38px;
      height:38px;
      border:0;
      border-radius:50%;
      background:#f2f2f2;
      font-size:25px;
      cursor:pointer;
    }

    .mo-order {
      padding:16px;
      margin-bottom:12px;
      border:1px solid #eee;
      border-radius:14px;
      background:#fafafa;
    }

    .mo-order-top {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .mo-order-top strong,
    .mo-order-top small {
      display:block;
    }

    .mo-order-top small {
      color:#777;
      margin-top:4px;
    }

    .mo-status {
      padding:6px 9px;
      border-radius:20px;
      font-size:10px;
      font-weight:800;
      background:#eee;
    }

    .mo-placed,
    .mo-pending {
      background:#fff1c7;
      color:#8a5b00;
    }

    .mo-confirmed,
    .mo-packing,
    .mo-packed {
      background:#e7f0ff;
      color:#2457a6;
    }

    .mo-out_for_delivery,
    .mo-delivered {
      background:#d9f7df;
      color:#08752b;
    }

    .mo-cancelled,
    .mo-refunded {
      background:#ffe2e2;
      color:#a40000;
    }

    .mo-details {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:15px;
    }

    .mo-details div {
      padding:10px;
      border-radius:10px;
      background:#fff;
    }

    .mo-details span {
      display:block;
      color:#777;
      font-size:12px;
      margin-bottom:4px;
    }

    .mo-payment {
      display:flex;
      justify-content:space-between;
      gap:10px;
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #eee;
      color:#666;
      font-size:13px;
    }

    .mo-loading,
    .mo-empty,
    .mo-error {
      padding:30px;
      text-align:center;
    }

    .mo-empty div {
      font-size:35px;
      margin-bottom:10px;
    }

    .mo-empty p {
      color:#777;
    }

    .mo-error {
      color:#b00020;
    }

    @media(max-width:600px) {
      .mo-card {
        width:96%;
        margin-top:3vh;
        padding:16px;
      }

      .mo-order-top {
        align-items:flex-start;
        flex-direction:column;
      }

      .mo-details {
        grid-template-columns:1fr;
      }

      .mo-payment {
        align-items:flex-start;
        flex-direction:column;
      }
    }
  `;

  document.head.appendChild(style);
})();
</script>


<script>
(() => {
  function refreshOrdersButton() {
    const btn = document.getElementById("myOrdersBtn");
    if (!btn) return;

    btn.onclick = () => {
      if (!localStorage.getItem("delyvo_access_token")) {
        if (typeof window.openLogin === "function") {
          window.openLogin();
        } else {
          alert("Please login first.");
        }
        return;
      }

      if (typeof window.openMyOrders === "function") {
        window.openMyOrders();
      }
    };
  }

  refreshOrdersButton();

  window.refreshOrdersButton = refreshOrdersButton;
})();
</script>


<script>
(() => {
  const DLV_URL = "https://unwdkreujyejgcucgttj.supabase.co";
  const DLV_KEY = "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

  async function orderApi(path) {
    const token = localStorage.getItem("delyvo_access_token");

    if (!token) {
      throw new Error("Please login first.");
    }

    const response = await fetch(DLV_URL + path, {
      headers: {
        apikey: DLV_KEY,
        Authorization: "Bearer " + token
      }
    });

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.msg ||
        "Unable to load order"
      );
    }

    return data;
  }

  function statusText(status) {
    const map = {
      placed: "Order Received",
      pending: "Order Received",
      confirmed: "Order Confirmed",
      packing: "Packing",
      packed: "Ready",
      out_for_delivery: "Out for Delivery",
      delivered: "Delivered",
      cancelled: "Cancelled",
      refunded: "Refunded"
    };

    return map[status] || status;
  }

  function statusStep(status) {
    if (status === "placed" || status === "pending") return 1;
    if (status === "confirmed") return 2;
    if (status === "packing") return 3;
    if (status === "packed") return 4;
    if (status === "out_for_delivery") return 5;
    if (status === "delivered") return 6;

    // Cancelled/refunded orders should not show
    // a fake delivery progress step.
    if (status === "cancelled" || status === "refunded") return 0;

    return 0;
  }

  async function openOrderDetails(orderId) {
    let old = document.getElementById("delyvoOrderDetails");
    if (old) old.remove();

    const modal = document.createElement("div");
    modal.id = "delyvoOrderDetails";

    modal.innerHTML = `
      <div class="od-backdrop"></div>

      <div
        class="od-card"
        data-order-id="${escapeHtml(orderId)}"
      >
        <div class="od-head">
          <div>
            <h2>Order Details</h2>
            <p id="odOrderNumber">Loading...</p>
          </div>

          <button class="od-close">×</button>
        </div>

        <div id="odContent">
          <div class="od-loading">Loading order...</div>
        </div>
      </div>
    `;

    document.body.appendChild(modal);

    modal.querySelector(".od-close").onclick =
      () => modal.remove();

    try {
      const orders = await orderApi(
        "/rest/v1/orders" +
        "?select=id,order_number,status,payment_status,subtotal,delivery_fee,total,created_at,delivered_at,address_id" +
        "&id=eq." + encodeURIComponent(orderId) +
        "&limit=1"
      );

      if (!orders.length) {
        throw new Error("Order not found.");
      }

      const order = orders[0];

      let address = null;

      if (order.address_id) {
        const addresses = await orderApi(
          "/rest/v1/addresses" +
          "?select=recipient_name,phone,address_line1,address_line2,landmark,city,state,pincode" +
          "&id=eq." + encodeURIComponent(order.address_id) +
          "&limit=1"
        );

        address = addresses[0] || null;
      }

      const items = await orderApi(
        "/rest/v1/order_items" +
        "?select=id,product_name,variant_name,quantity,unit_price,total" +
        "&order_id=eq." + encodeURIComponent(orderId) +
        "&order=id"
      );

      document.getElementById("odOrderNumber").textContent =
        order.order_number;

      const current = statusStep(order.status);

      const steps = [
        ["Order Received", 1],
        ["Confirmed", 2],
        ["Packing", 3],
        ["Ready", 4],
        ["Out for Delivery", 5],
        ["Delivered", 6]
      ];

      let timeline = "";

      if (
        order.status === "cancelled" ||
        order.status === "refunded"
      ) {
        const cancelledLabel =
          order.status === "refunded"
            ? "Refunded"
            : "Order Cancelled";

        timeline = `
          <div
            class="od-cancelled-status"
            data-status="${escapeHtml(order.status)}"
          >
            <div class="od-cancelled-icon">
              ${order.status === "refunded" ? "↩" : "×"}
            </div>

            <div>
              <strong>${cancelledLabel}</strong>
              <span>
                ${
                  order.status === "refunded"
                    ? "This order has been refunded."
                    : "This order was cancelled."
                }
              </span>
            </div>
          </div>
        `;
      } else {
        steps.forEach(([label, step]) => {
          let cls = "";

          if (step < current) cls = "done";
          if (step === current) cls = "active";

          timeline += `
            <div class="od-step ${cls}">
              <div class="od-dot">
                ${step < current ? "✓" : step}
              </div>
              <span>${label}</span>
            </div>
          `;
        });
      }

      let itemHtml = "";

      items.forEach(item => {
        itemHtml += `
          <div class="od-item">
            <div>
              <strong>${escapeHtml(item.product_name)}</strong>
              ${
                item.variant_name
                ? `<small>${escapeHtml(item.variant_name)}</small>`
                : ""
              }
              <span>Qty: ${Number(item.quantity || 0)}</span>
            </div>

            <strong>
              ₹${Number(item.total || 0).toFixed(0)}
            </strong>
          </div>
        `;
      });

      if (!itemHtml) {
        itemHtml = `<p class="od-muted">No item details available.</p>`;
      }

      document.getElementById("odContent").innerHTML = `
        <div class="od-current">
          <span>Current Status</span>
          <strong>${escapeHtml(statusText(order.status))}</strong>
        </div>

        <div class="od-timeline">
          ${timeline}
        </div>

        <div class="od-section">
          <h3>Items</h3>
          ${itemHtml}
        </div>

        <div class="od-section">
          <h3>Delivery Address</h3>

          <div class="od-address">
            <strong>${escapeHtml(address?.recipient_name || "")}</strong>

            ${address?.phone
              ? `<div>${escapeHtml(address.phone)}</div>`
              : ""}

            <div>
              ${escapeHtml(address?.address_line1 || "")}
              ${address?.address_line2
                ? ", " + escapeHtml(address.address_line2)
                : ""}
            </div>

            ${address?.landmark
              ? `<div>Landmark: ${escapeHtml(address.landmark)}</div>`
              : ""}

            <div>
              ${escapeHtml(address?.city || "")}
              ${address?.state
                ? ", " + escapeHtml(address.state)
                : ""}
              - ${escapeHtml(address?.pincode || "")}
            </div>
          </div>
        </div>

<script>

  async function addressApi(path, options = {}) {
    if (!token()) {
      throw new Error("Please login first.");
    }

    const response = await fetch(DLV_URL + path, {
      ...options,
      headers: {
        apikey: DLV_KEY,
        Authorization: "Bearer " + token(),
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.msg ||
        data?.hint ||
        "Address request failed"
      );
    }

    return data;
  }

<script>
(() => {
  function getCartData() {
    try {
      return JSON.parse(
        localStorage.getItem("delyvo_grocery_cart") || "[]"
      );
    } catch {
      return [];
    }
  }

  function saveCartData(cart) {
    localStorage.setItem(
      "delyvo_grocery_cart",
      JSON.stringify(cart)
    );
  }

  function renderFinalCart() {
    const cart = getCartData();

    const count = cart.reduce(
      (sum, item) => sum + Number(item.quantity || 0),
      0
    );

    const subtotal = cart.reduce(
      (sum, item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );

    const delivery = subtotal >= 199 ? 29 : 0;
    const total = subtotal + delivery;

    const countEl =
      document.getElementById("cartCount");

    if (countEl) {
      countEl.textContent = count;
    }

    const box =
      document.getElementById("cartItems") ||
      document.getElementById("cartContent");

    if (!box) return;

    if (!cart.length) {
      box.innerHTML = `
        <div class="dc-empty-cart">
          <div class="dc-empty-icon">🛒</div>
          <h3>Your cart is empty</h3>
          <p>Add grocery products to continue.</p>
        </div>
      `;
      updateCartTotals(0, 0, 0);
      return;
    }

    box.innerHTML = cart.map((item, index) => {
      const qty = Number(item.quantity || 0);
      const price = Number(item.price || 0);
      const line = price * qty;

      return `
        <div class="dc-cart-item">
          <div class="dc-cart-info">
            <strong>${escapeHtml(item.name)}</strong>
            <small>₹${price}</small>
          </div>

          <div class="dc-cart-actions">
            <button
              class="dc-qty"
              data-action="minus"
              data-index="${index}"
            >−</button>

            <span>${qty}</span>

            <button
              class="dc-qty"
              data-action="plus"
              data-index="${index}"
            >+</button>

            <strong>₹${line}</strong>

            <button
              class="dc-remove"
              data-action="remove"
              data-index="${index}"
            >Remove</button>
          </div>
        </div>
      `;
    }).join("");

    box.querySelectorAll("[data-action]").forEach(button => {
      button.onclick = () => {
        const index =
          Number(button.dataset.index);

        const action =
          button.dataset.action;

        const current = getCartData();

        if (!current[index]) return;

        if (action === "plus") {
          current[index].quantity =
            Number(current[index].quantity || 0) + 1;
        }

        if (action === "minus") {
          current[index].quantity =
            Number(current[index].quantity || 0) - 1;

          if (current[index].quantity <= 0) {
            current.splice(index, 1);
          }
        }

        if (action === "remove") {
          current.splice(index, 1);
        }

        saveCartData(current);
        renderFinalCart();
      });
    });

    updateCartTotals(
      subtotal,
      delivery,
      total
    );
  }

  function updateCartTotals(
    subtotal,
    delivery,
    total
  ) {
    const subtotalEl =
      document.getElementById("cartSubtotal");

    const deliveryEl =
      document.getElementById("cartDelivery");

    const totalEl =
      document.getElementById("cartTotal");

    if (subtotalEl) {
      subtotalEl.textContent =
        "₹" + subtotal.toFixed(0);
    }

    if (deliveryEl) {
      deliveryEl.textContent =
        "₹" + delivery.toFixed(0);
    }

    if (totalEl) {
      totalEl.textContent =
        "₹" + total.toFixed(0);
    }

    const minMessage =
      document.getElementById("cartMinimumMessage");

    if (minMessage) {
      if (subtotal > 0 && subtotal < 199) {
        minMessage.textContent =
          "Minimum order ₹199 hai.";
        minMessage.style.display = "block";
      } else {
        minMessage.style.display = "none";
      }
    }
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  window.renderFinalCart = renderFinalCart;

  const style =
    document.createElement("style");

  style.textContent = `
    .dc-empty-cart {
      text-align:center;
      padding:40px 20px;
      color:#777;
    }

    .dc-empty-icon {
      font-size:45px;
      margin-bottom:10px;
    }

    .dc-cart-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      padding:14px 0;
      border-bottom:1px solid #eee;
    }

    .dc-cart-info strong,
    .dc-cart-info small {
      display:block;
    }

    .dc-cart-info small {
      color:#777;
      margin-top:5px;
    }

    .dc-cart-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .dc-qty {
      width:32px;
      height:32px;
      border:1px solid #ddd;

      font-size:18px;

    .dc-remove {

    }

    #cartMinimumMessage {
      padding:10px;
      margin-top:10px;
      border-radius:8px;
      background:#fff3cd;

      font-weight:700;
    }

    @media(max-width:600px) {
      .dc-cart-item {
        align-items:flex-start;
        flex-direction:column;
      }

      .dc-cart-actions {
        width:100%;
      }
    }
  `;

  document.head.appendChild(style);

  if (document.readyState === "loading") {
    document.addEventListener(

})();
</script>

<!-- DELYVO CUSTOMER CANCEL ORDER -->
<script>
(() => {
  const DLV_URL =
    "https://unwdkreujyejgcucgttj.supabase.co";

  const DLV_KEY =
    "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6";

  function getToken() {
    return localStorage.getItem("delyvo_access_token") || "";
  }

  async function cancelDelyvoOrder(orderId) {
    const token = getToken();

    if (!token) {
      alert("Please login first.");
      return;
    }

    if (!orderId) {
      alert("Order ID nahi mila.");
      return;
    }

    const confirmed = confirm(
      "Kya aap ye order cancel karna chahte hain?"
    );

    if (!confirmed) return;

    const response = await fetch(
      DLV_URL + "/rest/v1/rpc/transition_order_status",
      {
        method: "POST",
        headers: {
          apikey: DLV_KEY,
          Authorization: "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          p_order_id: orderId,
          p_new_status: "cancelled"
        })
      }
    );

    const data = await response.json().catch(() => null);

    if (!response.ok) {
      throw new Error(
        data?.message ||
        data?.msg ||
        data?.hint ||
        "Order cancel nahi ho paya."
      );
    }

    alert("Order successfully cancelled.");

    const modal =
      document.querySelector(".od-card") ||
      document.querySelector("#delyvoOrderDetails");

    if (modal) {
      const oldButton =
        modal.querySelector(".delyvo-cancel-order-btn");

      if (oldButton) {
        oldButton.remove();
      }
    }

    if (typeof window.openMyOrders === "function") {
      await window.openMyOrders();
    }
  }

  window.cancelDelyvoOrder = cancelDelyvoOrder;

  async function addCancelButton(orderId) {
    if (!orderId) return;

    const token = getToken();
    if (!token) return;

    try {
      const response = await fetch(
        DLV_URL +
        "/rest/v1/orders" +
        "?select=id,status" +
        "&id=eq." +
        encodeURIComponent(orderId) +
        "&limit=1",
        {
          headers: {
            apikey: DLV_KEY,
            Authorization: "Bearer " + token
          }
        }
      );

      const orders = await response.json();

      if (!response.ok || !orders.length) return;

      const status = orders[0].status;

      /*
       * Backend cancellation flow:
       * pending   -> cancelled
       * confirmed -> cancelled
       *
       * Baaki status me customer cancel button nahi dikhega.
       */
      if (
        status !== "pending" &&
        status !== "confirmed"
      ) {
        return;
      }

      const modal =
        document.querySelector(".od-card") ||
        document.querySelector("#delyvoOrderDetails");

      if (!modal) return;

      if (
        modal.querySelector(".delyvo-cancel-order-btn")
      ) {
        return;
      }

      const button = document.createElement("button");

      button.className = "delyvo-cancel-order-btn";
      button.textContent = "Cancel Order";

      button.onclick = async () => {
        try {
          button.disabled = true;
          button.textContent = "Cancelling...";

          await cancelDelyvoOrder(orderId);

        } catch (error) {
          button.disabled = false;
          button.textContent = "Cancel Order";

          alert(
            error.message ||
            "Order cancel nahi ho paya."
          );
        }
      };

      modal.appendChild(button);
    } catch (error) {
      console.error(
        "DELYVO CANCEL BUTTON ERROR:",
        error
      );
    }
  }

  function connectCancelOrder() {
    if (
      typeof window.openOrderDetails !== "function"
    ) {
      return;
    }

    if (
      window.openOrderDetails.__delyvoCancelWrapped
    ) {
      return;
    }

    const originalOpenOrderDetails =
      window.openOrderDetails;

    const wrappedOpenOrderDetails =
      async function(orderId) {

        const result =
          await originalOpenOrderDetails.apply(
            this,
            arguments
          );

        setTimeout(() => {
          addCancelButton(orderId);
        }, 250);

        return result;
      };

    wrappedOpenOrderDetails.__delyvoCancelWrapped = true;

    window.openOrderDetails =
      wrappedOpenOrderDetails;
  }

  setTimeout(connectCancelOrder, 300);

  const observer =
    new MutationObserver(() => {
      connectCancelOrder();
    });

  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

  const style = document.createElement("style");

  style.textContent = `
    .delyvo-cancel-order-btn {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      border: 1px solid #dc2626;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .delyvo-cancel-order-btn:hover {
      background: #fef2f2;
    }

    .delyvo-cancel-order-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  `;

  document.head.appendChild(style);

  console.log(
    "DELYVO CUSTOMER CANCEL ORDER READY"
  );
})();
</script>

<script>
(() => {
  function normalizeStatus(value) {
    return String(value || "")
      .trim()
      .toLowerCase();
  }

  function applyCancelledOrderUI(root) {
    if (!root) return;

    const elements = root.querySelectorAll(
      "[data-status], .order-card, .od-card"
    );

    elements.forEach(element => {
      const status =
        normalizeStatus(
          element.getAttribute("data-status")
        );

      if (
        status !== "cancelled" &&
        status !== "refunded"
      ) {
        return;
      }

      element.classList.add(
        "delyvo-order-cancelled"
      );

      const progress =
        element.querySelector(
          ".order-progress, .od-progress, .status-progress"
        );

      if (progress) {
        progress.classList.add(
          "delyvo-cancelled-progress"
        );
      }

      const existingLabel =
        element.querySelector(
          ".delyvo-cancelled-label"
        );

      if (!existingLabel) {
        const label =
          document.createElement("div");

        label.className =
          "delyvo-cancelled-label";

        label.textContent =
          status === "refunded"
            ? "Refunded"
            : "Order Cancelled";

        const heading =
          element.querySelector(
            "h2, h3, .order-title, .od-head"
          );

        if (heading && heading.parentNode) {
          heading.parentNode.appendChild(label);
        } else {
          element.prepend(label);
        }
      }

      element
        .querySelectorAll(
          ".delyvo-cancel-order-btn"
        )
        .forEach(button => {
          button.remove();
        });
    });
  }

  function scanCancelledOrders() {
    applyCancelledOrderUI(
      document
        .getElementById("delyvoOrderDetails") ||
      document.body
    );
  }

  window.delyvoApplyCancelledOrderUI =
    applyCancelledOrderUI;

  window.delyvoScanCancelledOrders =
    scanCancelledOrders;

  const observer =
    new MutationObserver(() => {
      scanCancelledOrders();
    });

  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

  setTimeout(
    scanCancelledOrders,
    500
  );

  const style =
    document.createElement("style");

  style.textContent = `
    .delyvo-order-cancelled {
      opacity: .96;
    }

    .delyvo-cancelled-label {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12px;
      font-weight: 800;
    }

    .delyvo-cancelled-progress {
      display: none !important;
    }

    .delyvo-order-cancelled
    .delyvo-cancel-order-btn {
      display: none !important;
    }
  `;

  document.head.appendChild(style);

  console.log(
    "DELYVO CANCELLED ORDER UI READY"
  );
})();
</script>

<!-- DELYVO CUSTOMER ORDER STATUS AUTO REFRESH -->
<script>
(() => {
  let refreshTimer = null;
  let activeOrderId = null;
  let refreshing = false;

  function getToken() {
    return localStorage.getItem("delyvo_access_token") || "";
  }

  async function refreshCurrentOrder() {
    if (!activeOrderId || refreshing) return;

    const token = getToken();
    if (!token) return;

    refreshing = true;

    try {
      const url =
        "https://unwdkreujyejgcucgttj.supabase.co" +
        "/rest/v1/orders" +
        "?select=id,order_number,status,payment_status,subtotal,delivery_fee,total,created_at,delivered_at,address_id" +
        "&id=eq." +
        encodeURIComponent(activeOrderId) +
        "&limit=1";

      const response = await fetch(url, {
        headers: {
          apikey:
            "sb_publishable_QylVZHuaIj98axBkNuvbFA_Z6NX-9Q6",
          Authorization:
            "Bearer " + token
        }
      });

      const orders = await response.json();

      if (!response.ok || !orders.length) {
        return;
      }

      const order = orders[0];

      const statusElement =
        document.querySelector(".od-current strong");

      if (statusElement) {
        const labels = {
          placed: "Order Received",
          pending: "Order Received",
          confirmed: "Order Confirmed",
          packing: "Packing",
          packed: "Ready",
          out_for_delivery: "Out for Delivery",
          delivered: "Delivered",
          cancelled: "Cancelled",
          refunded: "Refunded"
        };

        statusElement.textContent =
          labels[order.status] ||
          order.status ||
          "";
      }

      /*
       * Cancelled / refunded order
       * ke liye complete details dobara
       * render karenge.
       */
      if (
        order.status === "cancelled" ||
        order.status === "refunded"
      ) {
        if (
          typeof window.openOrderDetails === "function"
        ) {
          await window.openOrderDetails(
            activeOrderId
          );
        }

        stopRefresh();
      }

    } catch (error) {
      console.error(
        "DELYVO ORDER STATUS REFRESH ERROR:",
        error
      );
    } finally {
      refreshing = false;
    }
  }

  function startRefresh(orderId) {
    if (!orderId) return;

    activeOrderId = orderId;

    if (refreshTimer) {
      clearInterval(refreshTimer);
    }

    refreshCurrentOrder();

    refreshTimer = setInterval(
      refreshCurrentOrder,
      15000
    );
  }

  function stopRefresh() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }

    activeOrderId = null;
  }

  window.delyvoStartOrderStatusRefresh =
    startRefresh;

  window.delyvoStopOrderStatusRefresh =
    stopRefresh;

  /*
   * Existing openOrderDetails ko wrap karke
   * automatic refresh start karenge.
   */
  function connectOrderRefresh() {
    if (
      typeof window.openOrderDetails !== "function"
    ) {
      return;
    }

    if (
      window.openOrderDetails.__delyvoStatusRefresh
    ) {
      return;
    }

    const originalOpenOrderDetails =
      window.openOrderDetails;

    const wrappedOpenOrderDetails =
      async function(orderId) {

        const result =
          await originalOpenOrderDetails.apply(
            this,
            arguments
          );

        startRefresh(orderId);

        return result;
      };

    wrappedOpenOrderDetails
      .__delyvoStatusRefresh = true;

    window.openOrderDetails =
      wrappedOpenOrderDetails;
  }

  setTimeout(
    connectOrderRefresh,
    500
  );

  const observer =
    new MutationObserver(() => {
      connectOrderRefresh();
    });

  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

  /*
   * Modal close hone par refresh stop.
   */
  document.addEventListener(
    "click",
    event => {
      const target = event.target;

      if (
        target &&
        target.classList &&
        target.classList.contains("od-close")
      ) {
        stopRefresh();
      }
    }
  );

  console.log(
    "DELYVO CUSTOMER ORDER STATUS AUTO REFRESH READY"
  );
})();
</script>


<!-- DELYVO LIVE ORDER TIMELINE SYNC -->
<script>
(() => {
  function getStep(status) {
    const map = {
      placed: 1,
      pending: 1,
      confirmed: 2,
      packing: 3,
      packed: 4,
      out_for_delivery: 5,
      delivered: 6
    };

    return map[status] || 0;
  }

  function updateTimeline(status) {
    const timeline =
      document.querySelector(".od-timeline");

    if (!timeline) return;

    if (
      status === "cancelled" ||
      status === "refunded"
    ) {
      return;
    }

    const current = getStep(status);

    const steps =
      timeline.querySelectorAll(".od-step");

    steps.forEach((stepElement, index) => {
      const step = index + 1;

      stepElement.classList.remove(
        "done",
        "active"
      );

      const dot =
        stepElement.querySelector(".od-dot");

      if (step < current) {
        stepElement.classList.add("done");

        if (dot) {
          dot.textContent = "✓";
        }
      } else if (step === current) {
        stepElement.classList.add("active");

        if (dot) {
          dot.textContent = String(step);
        }
      } else {
        if (dot) {
          dot.textContent = String(step);
        }
      }
    });
  }

  window.delyvoUpdateOrderTimeline =
    updateTimeline;

  /*
   * Existing auto-refresh function ko monitor
   * karke status change par timeline update.
   */
  const originalRefresh =
    window.delyvoStartOrderStatusRefresh;

  if (
    typeof originalRefresh === "function"
  ) {
    console.log(
      "DELYVO LIVE ORDER TIMELINE SYNC READY"
    );
  }

  /*
   * MutationObserver se current status text
   * change detect karke timeline refresh.
   */
  const observer =
    new MutationObserver(() => {
      const statusElement =
        document.querySelector(
          ".od-current strong"
        );

      if (!statusElement) return;

      const text =
        statusElement.textContent
          .trim()
          .toLowerCase();

      const statusMap = {
        "order received": "pending",
        "order confirmed": "confirmed",
        "packing": "packing",
        "ready": "packed",
        "out for delivery": "out_for_delivery",
        "delivered": "delivered"
      };

      const status =
        statusMap[text];

      if (status) {
        updateTimeline(status);
      }
    });

  observer.observe(
    document.body,
    {
      childList: true,
      subtree: true,
      characterData: true
    }
  );

  console.log(
    "DELYVO LIVE ORDER TIMELINE SYNC READY"
  );
})();
</script>


<script>
/* =========================================================
   DELYVO CUSTOMER CART CHECKOUT V8
   Cart quantity + remove + totals + checkout validation
   ========================================================= */
(() => {
  const MARKER = "DELYVO CUSTOMER CART CHECKOUT V8";
  const DELIVERY_FEE = 29;
  const MIN_ORDER = 199;

  function getCart() {
    try {
      const cart = JSON.parse(
        localStorage.getItem("delyvo_grocery_cart") || "[]"
      );
      return Array.isArray(cart) ? cart : [];
    } catch {
      return [];
    }
  }

  function saveCart(cart) {
    localStorage.setItem(
      "delyvo_grocery_cart",
      JSON.stringify(cart)
    );
  }

  function itemPrice(item) {
    return Number(
      item.selling_price ??
      item.price ??
      0
    );
  }

  function cartSubtotal(cart) {
    return cart.reduce(
      (sum, item) =>
        sum + itemPrice(item) * Number(item.quantity || 0),
      0
    );
  }

  function updateCartQuantity(index, change) {
    const cart = getCart();

    if (!cart[index]) return;

    const next =
      Number(cart[index].quantity || 1) + change;

    if (next <= 0) {
      cart.splice(index, 1);
    } else {
      cart[index].quantity = next;
    }

    saveCart(cart);

    if (typeof window.renderCart === "function") {
      window.renderCart();
    }

    if (typeof window.updateCartCount === "function") {
      window.updateCartCount();
    }

    updateCheckoutSummary();
  }

  function removeCartItem(index) {
    const cart = getCart();

    if (!cart[index]) return;

    cart.splice(index, 1);
    saveCart(cart);

    if (typeof window.renderCart === "function") {
      window.renderCart();
    }

    if (typeof window.updateCartCount === "function") {
      window.updateCartCount();
    }

    updateCheckoutSummary();
  }

  function updateCheckoutSummary() {
    const cart = getCart();
    const subtotal = cartSubtotal(cart);

    const delivery =
      subtotal > 0 ? DELIVERY_FEE : 0;

    const total =
      subtotal + delivery;

    const subtotalEls =
      document.querySelectorAll(
        "[data-delyvo-subtotal]"
      );

    subtotalEls.forEach(el => {
      el.textContent =
        `₹${subtotal.toFixed(2)}`;
    });

    const deliveryEls =
      document.querySelectorAll(
        "[data-delyvo-delivery]"
      );

    deliveryEls.forEach(el => {
      el.textContent =
        `₹${delivery.toFixed(2)}`;
    });

    const totalEls =
      document.querySelectorAll(
        "[data-delyvo-total]"
      );

    totalEls.forEach(el => {
      el.textContent =
        `₹${total.toFixed(2)}`;
    });

    const minimumEls =
      document.querySelectorAll(
        "[data-delyvo-minimum-message]"
      );

    minimumEls.forEach(el => {
      if (!subtotal) {
        el.textContent = "";
      } else if (subtotal < MIN_ORDER) {
        el.textContent =
          `Minimum order ₹${MIN_ORDER}. ` +
          `Add ₹${(MIN_ORDER - subtotal).toFixed(2)} more.`;
      } else {
        el.textContent =
          "Minimum order reached.";
      }
    });
  }

  function validateCartForCheckout() {
    const cart = getCart();
    const subtotal = cartSubtotal(cart);

    if (!cart.length) {
      alert("Cart is empty.");
      return false;
    }

    if (subtotal < MIN_ORDER) {
      alert(
        `Minimum order ₹${MIN_ORDER} hai.\n` +
        `Abhi cart ₹${subtotal.toFixed(2)} ka hai.`
      );
      return false;
    }

    return true;
  }

  window.delyvoUpdateCartQuantityV8 =
    updateCartQuantity;

  window.delyvoRemoveCartItemV8 =
    removeCartItem;

  window.delyvoUpdateCheckoutSummaryV8 =
    updateCheckoutSummary;

  window.delyvoValidateCartForCheckoutV8 =
    validateCartForCheckout;

  window.delyvoCartV8Config = {
    deliveryFee: DELIVERY_FEE,
    minimumOrder: MIN_ORDER
  };

  document.addEventListener(
    "click",
    event => {
      const plus =
        event.target.closest(
          "[data-delyvo-cart-plus]"
        );

      const minus =
        event.target.closest(
          "[data-delyvo-cart-minus]"
        );

      const remove =
        event.target.closest(
          "[data-delyvo-cart-remove]"
        );

      if (plus) {
        updateCartQuantity(
          Number(plus.dataset.delyvoCartPlus),
          1
        );
      }

      if (minus) {
        updateCartQuantity(
          Number(minus.dataset.delyvoCartMinus),
          -1
        );
      }

      if (remove) {
        removeCartItem(
          Number(remove.dataset.delyvoCartRemove)
        );
      }
    }
  );

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoCartCheckoutV8Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement("style");

    style.id =
      "delyvoCartCheckoutV8Styles";

    style.textContent = `
      .delyvo-cart-qty-v8 {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .delyvo-cart-qty-v8 button {
        width: 30px;
        height: 30px;
        border: 1px solid #ddd;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        font-size: 17px;
      }

      .delyvo-cart-remove-v8 {
        border: 0;
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        text-decoration: underline;
      }

      .delyvo-checkout-minimum-v8 {
        margin-top: 8px;
        font-size: 12px;
      }
    `;

    document.head.appendChild(style);
  }

  function init() {
    injectStyles();
    updateCheckoutSummary();
  }

  window.addEventListener(
    "load",
    () => setTimeout(init, 700)
  );

  document.addEventListener(
    "DOMContentLoaded",
    () => setTimeout(init, 700)
  );

  console.log(MARKER);
  console.log("Cart quantity controls : YES");
  console.log("Cart remove support : YES");
  console.log("Subtotal calculation : YES");
  console.log("Delivery fee ₹29 : YES");
  console.log("Minimum order ₹199 : YES");
  console.log("Checkout validation : YES");
  console.log("COD preserved : YES");
})();
</script>

<script>
/* =========================================================
   DELYVO CUSTOMER ORDER SUCCESS CONNECT V11
   Connect successful checkout -> V10 confirmation screen
   ========================================================= */
(() => {
  const MARKER = "DELYVO CUSTOMER ORDER SUCCESS CONNECT V11";

  function openV10Success(order) {
    if (
      typeof window.showDelyvoOrderSuccessV10 ===
      "function"
    ) {
      window.showDelyvoOrderSuccessV10(order);
      return true;
    }

    if (
      typeof window.delyvoOrderSuccessV10 ===
      "function"
    ) {
      window.delyvoOrderSuccessV10(order);
      return true;
    }

    return false;
  }

  function connectCheckoutSuccess() {
    if (
      window.__delyvoV11CheckoutConnected
    ) {
      return;
    }

    if (
      typeof window.finalDelyvoCheckout !==
      "function"
    ) {
      return;
    }

    const originalCheckout =
      window.finalDelyvoCheckout;

    if (
      originalCheckout.__delyvoV11Wrapped
    ) {
      window.__delyvoV11CheckoutConnected =
        true;
      return;
    }

    async function wrappedCheckout() {
      const result =
        await originalCheckout.apply(
          this,
          arguments
        );

      /*
       * The existing checkout already handles
       * order creation, cart clearing and the
       * existing success flow.
       *
       * We only open the new V10 confirmation
       * after successful order creation.
       */
      if (result) {
        setTimeout(() => {
          openV10Success(result);
        }, 120);
      }

      return result;
    }

    wrappedCheckout.__delyvoV11Wrapped =
      true;

    window.finalDelyvoCheckout =
      wrappedCheckout;

    window.__delyvoV11CheckoutConnected =
      true;

    console.log(
      "DELYVO V11 checkout connected"
    );
  }

  /*
   * V10 may be defined later in index.html,
   * therefore retry connection safely.
   */
  function init() {
    connectCheckoutSuccess();

    let attempts = 0;

    const timer =
      setInterval(() => {
        attempts += 1;

        connectCheckoutSuccess();

        if (
          window.__delyvoV11CheckoutConnected ||
          attempts >= 20
        ) {
          clearInterval(timer);
        }
      }, 250);
  }

  window.addEventListener(
    "DOMContentLoaded",
    init
  );

  window.addEventListener(
    "load",
    () => {
      setTimeout(init, 300);
    }
  );

  console.log(MARKER);
  console.log(
    "Checkout success connection : YES"
  );
  console.log(
    "V10 success screen connection : YES"
  );
  console.log(
    "Existing checkout preserved : YES"
  );
})();
</script>


<script>
/* =========================================================
   DELYVO CUSTOMER MY ORDERS POLISH V12
   Professional order history + order details polish
   ========================================================= */
(() => {
  const MARKER = "DELYVO CUSTOMER MY ORDERS POLISH V12";

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function money(value) {
    return "₹" + Number(value || 0).toFixed(2);
  }

  function normalizeStatus(status) {
    return String(status || "")
      .trim()
      .toLowerCase();
  }

  function statusLabel(status) {
    const map = {
      placed: "Order Received",
      pending: "Order Received",
      confirmed: "Order Confirmed",
      packing: "Packing",
      packed: "Ready",
      out_for_delivery: "Out for Delivery",
      delivered: "Delivered",
      cancelled: "Cancelled",
      refunded: "Refunded"
    };

    return map[normalizeStatus(status)] ||
      status ||
      "Order";
  }

  function statusClass(status) {
    const value = normalizeStatus(status);

    if (
      value === "cancelled" ||
      value === "refunded"
    ) {
      return "cancelled";
    }

    if (value === "delivered") {
      return "delivered";
    }

    if (value === "out_for_delivery") {
      return "delivery";
    }

    if (
      value === "confirmed" ||
      value === "packing" ||
      value === "packed"
    ) {
      return "active";
    }

    return "pending";
  }

  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return date.toLocaleString("en-IN", {
      day: "2-digit",
      month: "short",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  }

            statusClass(statusMatch[0]);

    `;

    document.head.appendChild(style);
  }

  function init() {

    enhanceOrderCards();
    enhanceOrderDetails();
  }

  const observer =
    new MutationObserver(() => {
      enhanceOrderCards();
      enhanceOrderDetails();
    });

  function startObserver() {
    if (!document.body) {
      return;
    }

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  }

  window.delyvoRefreshMyOrdersV12 =
    init;

  window.delyvoMyOrdersPolishV12 =

<script>
/* =========================================================
   DELYVO CUSTOMER SHOPPING UI POLISH V13
   Search + Categories + Product Cards
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER SHOPPING UI POLISH V13";

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getProducts() {
    if (Array.isArray(window.allProducts)) {
      return window.allProducts;
    }

    if (
      Array.isArray(
        window.delyvoLiveProducts
      )
    ) {
      return window.delyvoLiveProducts;
    }

    return [];
  }

  function getCategories() {
    if (Array.isArray(window.allCategories)) {
      return window.allCategories;
    }

    if (
      Array.isArray(
        window.delyvoLiveCategories
      )
    ) {
      return window.delyvoLiveCategories;
    }

    return [];
  }

  function money(value) {
    return "₹" +
      Number(value || 0).toFixed(2);
  }

  function normalize(value) {
    return String(value || "")
      .trim()
      .toLowerCase();
  }

  function enhanceSearch() {
    const inputs =
      document.querySelectorAll(
        'input[type="search"], input[placeholder*="earch"], #searchInput, #search'
      );

    inputs.forEach((input) => {
      if (
        input.dataset.delyvoV13 === "yes"
      ) {
        return;
      }

      input.dataset.delyvoV13 = "yes";
      input.classList.add(
        "delyvo-search-input-v13"
      );

      input.setAttribute(
        "autocomplete",
        "off"
      );

      input.setAttribute(
        "aria-label",
        "Search products"
      );

      input.addEventListener(
        "input",
        () => {
          const query =
            normalize(input.value);

          const products =
            getProducts();

          if (!products.length) {
            return;
          }

          const filtered =
            !query
              ? products
              : products.filter((product) => {
                  const text = [
                    product.name,
                    product.variant_name,
                    product.variantName,
                    product.unit,
                    product.category_name,
                    product.category
                  ]
                    .filter(Boolean)
                    .join(" ");

                  return normalize(
                    text
                  ).includes(query);
                });

          window.delyvoSearchResultsV13 =
            filtered;

          if (
            typeof window.renderProducts ===
            "function"
          ) {
            window.renderProducts(
              filtered
            );
          }

          updateSearchCount(
            query,
            filtered.length,
            products.length
          );
        }
      );
    });
  }

  function updateSearchCount(
    query,
    count,
    total
  ) {
    let box =
      document.getElementById(
        "delyvoSearchCountV13"
      );

    if (!box) {
      const productsBox =
        document.getElementById(
          "products"
        );

      if (!productsBox) {
        return;
      }

      box =
        document.createElement("div");

      box.id =
        "delyvoSearchCountV13";

      box.className =
        "delyvo-search-count-v13";

      productsBox.parentNode.insertBefore(
        box,
        productsBox
      );
    }

    if (!query) {
      box.textContent = "";
      box.style.display = "none";
      return;
    }

    box.style.display = "block";

    box.textContent =
      count === total
        ? `${count} products available`
        : `${count} product${count === 1 ? "" : "s"} found`;
  }

  function enhanceCategories() {
    const box =
      document.getElementById(
        "categories"
      );

    if (!box) {
      return;
    }

    box.classList.add(
      "delyvo-categories-v13"
    );

    const categories =
      getCategories();

    const cards =
      box.querySelectorAll(
        ".category"
      );

    cards.forEach((card, index) => {
      card.classList.add(
        "delyvo-category-card-v13"
      );

      const category =
        categories[index];

      if (
        category &&
        !card.dataset.delyvoCategoryName
      ) {
        card.dataset.delyvoCategoryName =
          category.name || "";
      }

      card.addEventListener(
        "click",
        () => {
          const name =
            card.dataset
              .delyvoCategoryName;

          if (!name) {
            return;
          }

          filterByCategory(name);
        }
      );
    });
  }

  function filterByCategory(name) {
    const products =
      getProducts();

    if (!products.length) {
      return;
    }

    const wanted =
      normalize(name);

    const filtered =
      products.filter((product) => {
        const category =
          normalize(
            product.category_name ||
            product.category ||
            product.categoryName
          );

        return (
          category === wanted ||
          category.includes(wanted) ||
          wanted.includes(category)
        );
      });

    /*
     * If product data does not yet contain
     * category information, leave the full
     * product list intact instead of hiding
     * products incorrectly.
     */
    if (!filtered.length) {
      return;
    }

    window.delyvoCategoryResultsV13 =
      filtered;

    if (
      typeof window.renderProducts ===
      "function"
    ) {
      window.renderProducts(
        filtered
      );
    }

    const productsBox =
      document.getElementById(
        "products"
      );

    if (productsBox) {
      productsBox.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }
  }

  function enhanceProductCards() {
    const productsBox =
      document.getElementById(
        "products"
      );

    if (!productsBox) {
      return;
    }

    productsBox.classList.add(
      "delyvo-products-v13"
    );

<script>
/* =========================================================
   DELYVO CUSTOMER CART UI POLISH V14
   Cart drawer + summary + checkout presentation
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER CART UI POLISH V14";

  function getCart() {
    try {
      const raw =
        localStorage.getItem(
          "delyvo_grocery_cart"
        );

      const cart =
        raw ? JSON.parse(raw) : [];

      return Array.isArray(cart)
        ? cart
        : [];
    } catch {
      return [];
    }
  }

  function money(value) {
    return "₹" +
      Number(value || 0).toFixed(2);
  }

  function cartSubtotal() {
    return getCart().reduce(
      (sum, item) =>
        sum +
        Number(
          item.price ??
          item.selling_price ??
          0
        ) *
        Number(item.quantity || 0),
      0
    );
  }

  function findCartRoot() {
    return (
      document.querySelector(
        "#cartModal"
      ) ||
      document.querySelector(
        ".cart-modal"
      ) ||
      document.querySelector(
        "[data-cart-modal]"
      ) ||
      document.querySelector(
        "#cart"
      )
    );
  }

  function enhanceCart() {
    const root =
      findCartRoot();

    if (!root) {
      return;
    }

    root.classList.add(
      "delyvo-cart-v14"
    );

    const subtotal =
      cartSubtotal();

    const delivery =
      subtotal >= 199
        ? 29
        : 0;

    const remaining =
      Math.max(
        199 - subtotal,
        0
      );

    let note =
      root.querySelector(
        ".delyvo-cart-min-note-v14"
      );

    if (!note) {
      note =
        document.createElement(
          "div"
        );

      note.className =
        "delyvo-cart-min-note-v14";

      const summary =
        root.querySelector(
          ".cart-summary, .cart-total, .checkout-summary, .cart-footer"
        );

      if (summary) {
        summary.prepend(note);
      } else {
        root.appendChild(note);
      }
    }

    if (subtotal <= 0) {
      note.textContent =
        "Your cart is empty.";
      note.className =
        "delyvo-cart-min-note-v14 empty";
    } else if (remaining > 0) {
      note.textContent =
        `Add ${money(remaining)} more to place your order. Minimum order is ₹199.`;
      note.className =
        "delyvo-cart-min-note-v14 warning";
    } else {
      note.textContent =
        "Minimum order reached. Delivery fee ₹29.";
      note.className =
        "delyvo-cart-min-note-v14 ready";
    }

    const checkoutButtons =
      root.querySelectorAll(
        "button"
      );

    checkoutButtons.forEach(
      (button) => {
        const text =
          String(
            button.textContent || ""
          ).trim().toLowerCase();

        if (
          text.includes("checkout") ||
          text.includes("place order") ||
          text.includes("proceed")
        ) {
          button.classList.add(
            "delyvo-cart-checkout-v14"
          );

          if (
            subtotal < 199
          ) {
            button.classList.add(
              "delyvo-cart-checkout-disabled-v14"
            );
          } else {
            button.classList.remove(
              "delyvo-cart-checkout-disabled-v14"
            );
          }
        }
      }
    );

    const items =
      root.querySelectorAll(
        ".cart-item, .cart-product, [data-cart-item]"
      );

    items.forEach((item) => {
      item.classList.add(
        "delyvo-cart-item-v14"
      );
    });
  }

  function enhanceCartTrigger() {
    const buttons =
      document.querySelectorAll(
        "button, a"
      );

    buttons.forEach((button) => {
      if (
        button.dataset
          .delyvoCartTriggerV14 ===
        "yes"
      ) {
        return;
      }

      const text =
        String(
          button.textContent || ""
        ).trim().toLowerCase();

      const label =
        String(
          button.getAttribute(
            "aria-label"
          ) || ""
        ).toLowerCase();

      if (
        text === "cart" ||
        text.includes("view cart") ||
        label.includes("cart")
      ) {
        button.dataset
          .delyvoCartTriggerV14 =
          "yes";

        button.classList.add(
          "delyvo-cart-trigger-v14"
        );
      }
    });
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoCartV14Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =
      "delyvoCartV14Styles";

    style.textContent = `
      .delyvo-cart-v14 {
        border-radius: 16px;
      }

      .delyvo-cart-item-v14 {
        border-radius: 12px;
        transition:
          background .15s ease,
          box-shadow .15s ease;
      }

      .delyvo-cart-item-v14:hover {
        background: #fafafa;
      }

      .delyvo-cart-min-note-v14 {
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: 9px;

        line-height: 1.45;
      }

      .delyvo-cart-min-note-v14.empty {
        background: #f5f5f5;
        color: #666;
      }

      .delyvo-cart-min-note-v14.warning {
        background: #fff4d6;
        color: #765600;
      }

      .delyvo-cart-min-note-v14.ready {
        background: #eaf7ee;
        color: #176b35;
      }

      .delyvo-cart-checkout-v14 {
        width: 100%;
        min-height: 46px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        transition:

          opacity .15s ease;
      }

      .delyvo-cart-checkout-v14:hover {
        transform: translateY(-1px);

        opacity: .55;

          padding: 8px;
        }

          min-height: 48px;
        }
      }
    `;

    document.head.appendChild(
      style

  }

  function init() {

    enhanceCart();
    enhanceCartTrigger();

  function startObserver() {
    if (!document.body) {
      return;

    observer.observe(
      document.body,
      {
        childList: true,
        subtree: true
      }
    );
  }

  window.delyvoRefreshCartUIV14 =
    init;

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(() => {
        init();
        startObserver();

<script>
/* =========================================================
   DELYVO CUSTOMER ACCOUNT UI POLISH V15
   Login / Signup / Account / Orders / Addresses
   Email + Password only — NO OTP
   ========================================================= */
(() => {
  const MARKER =
    "DELYVO CUSTOMER ACCOUNT UI POLISH V15";

  function getToken() {
    return (
      localStorage.getItem(
        "delyvo_access_token"
      ) || ""
    );
  }

  function getUser() {
    try {
      const raw =
        localStorage.getItem(
          "delyvo_auth_user"
        );

      return raw
        ? JSON.parse(raw)
        : null;
    } catch {
      return null;
    }
  }

  function findLoginButtons() {
    return document.querySelectorAll(
      "button, a"
    );
  }

  function enhanceAccountButtons() {
    findLoginButtons().forEach(
      (button) => {
        if (
          button.dataset
            .delyvoAccountV15 ===
          "yes"
        ) {
          return;
        }

        const text =
          String(
            button.textContent || ""
          )
            .trim()
            .toLowerCase();

        const label =
          String(
            button.getAttribute(
              "aria-label"
            ) || ""
          ).toLowerCase();

        if (
          text === "login" ||
          text === "log in" ||
          text === "account" ||
          text === "my account" ||
          label.includes("account") ||
          label.includes("login")
        ) {
          button.dataset
            .delyvoAccountV15 =
            "yes";

          button.classList.add(
            "delyvo-account-trigger-v15"
          );
        }
      }
    );
  }

  function injectAccountBadge() {
    const token =
      getToken();

    const user =
      getUser();

    const loggedIn =
      Boolean(token);

    let badge =
      document.getElementById(
        "delyvoAccountStatusV15"
      );

    if (!badge) {
      badge =
        document.createElement(
          "div"
        );

      badge.id =
        "delyvoAccountStatusV15";

      badge.className =
        "delyvo-account-status-v15";

      document.body.appendChild(
        badge
      );
    }

    if (loggedIn) {
      const email =
        user?.email ||
        "";

      badge.innerHTML = `
        <div class="delyvo-account-status-title-v15">
          Account
        </div>
        <div class="delyvo-account-status-email-v15">
          ${escapeHtml(email)}
        </div>
        <div class="delyvo-account-status-actions-v15">
          <button
            type="button"
            data-account-orders-v15>
            My Orders
          </button>
          <button
            type="button"
            data-account-address-v15>
            Addresses
          </button>
          <button
            type="button"
            data-account-logout-v15>
            Logout
          </button>
        </div>
      `;

      badge.style.display =
        "none";
    } else {
      badge.innerHTML = `
        <div class="delyvo-account-status-title-v15">
          Login required
        </div>
        <div class="delyvo-account-status-actions-v15">
          <button
            type="button"
            data-account-login-v15>
            Login
          </button>
        </div>
      `;

      badge.style.display =
        "none";
    }

    bindAccountActions();
  }

  function escapeHtml(value) {
    return String(
      value ?? ""
    )
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function bindAccountActions() {
    const login =
      document.querySelector(
        "[data-account-login-v15]"
      );

    if (login) {
      login.onclick = () => {
        if (
          typeof window.openLogin ===
          "function"
        ) {
          window.openLogin();
        }
      };
    }

    const orders =
      document.querySelector(
        "[data-account-orders-v15]"
      );

    if (orders) {
      orders.onclick = () => {
        if (
          typeof window.openMyOrders ===
          "function"
        ) {
          window.openMyOrders();
        }
      };
    }

    const address =
      document.querySelector(
        "[data-account-address-v15]"
      );

    if (address) {
      address.onclick = () => {
        if (
          typeof window.openAddressManager ===
          "function"
        ) {
          window.openAddressManager();
        }
      };
    }

    const logout =
      document.querySelector(
        "[data-account-logout-v15]"
      );

    if (logout) {
      logout.onclick = () => {
        localStorage.removeItem(
          "delyvo_access_token"
        );

        localStorage.removeItem(
          "delyvo_auth_user"
        );

        localStorage.removeItem(
          "delyvo_grocery_address"
        );

        if (
          typeof window.updateLoginButton ===
          "function"
        ) {
          window.updateLoginButton();
        }

        injectAccountBadge();

        alert(
          "You have been logged out."
        );
      };
    }
  }

  function injectStyles() {
    if (
      document.getElementById(
        "delyvoAccountV15Styles"
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        "style"
      );

    style.id =
      "delyvoAccountV15Styles";

    style.textContent = `
      .delyvo-account-trigger-v15 {
        min-height: 40px;
        border-radius: 9px;
        font-weight: 700;
      }

      .delyvo-account-status-v15 {
        position: fixed;
        right: 16px;
        top: 72px;
        z-index: 9998;
        width: min(320px, calc(100vw - 32px));
        padding: 16px;
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 12px 35px rgba(0,0,0,.16);
        border: 1px solid #eee;
      }

      .delyvo-account-status-title-v15 {
        font-size: 16px;
        font-weight: 800;
        margin-bottom: 5px;
      }

      .delyvo-account-status-email-v15 {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
        overflow-wrap: anywhere;
      }

      .delyvo-account-status-actions-v15 {
        display: grid;
        gap: 8px;
      }

      .delyvo-account-status-actions-v15 button {
        min-height: 40px;
        border: 1px solid #ddd;
        border-radius: 9px;
        background: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .delyvo-account-status-v15 {
          right: 10px;
          top: 64px;
          width: calc(100vw - 20px);
        }
      }
    `;

    document.head.appendChild(
      style
    );
  }

  function init() {
    injectStyles();
    enhanceAccountButtons();
    injectAccountBadge();
  }

  const observer =
    new MutationObserver(() => {
      enhanceAccountButtons();
      injectAccountBadge();
    });

  window.delyvoRefreshAccountUIV15 =
    init;

  window.addEventListener(
    "DOMContentLoaded",
    () => {
      setTimeout(() => {
        init();

        if (document.body) {
          observer.observe(
            document.body,
            {
              childList: true,
              subtree: true
            }
          );
        }
      }, 700);
    }
  );

  window.addEventListener(
    "load",
    () => {
      setTimeout(init, 1200);
    }
  );

  console.log(MARKER);
  console.log("Login UI polish : YES");
  console.log("Signup preserved : YES");
  console.log("Email/password only : YES");
  console.log("My Orders shortcut : YES");
  console.log("Address shortcut : YES");
  console.log("Logout support : YES");
  console.log("OTP : NOT USED");
})();

<script>

    try {
      const raw =
        localStorage.getItem(
          "delyvo_grocery_address"
        );

      return raw
        ? JSON.parse(raw)
        : null;
    } catch {
      return null;
    }
  }

      document.querySelectorAll(
        "#checkoutModal, .checkout-modal, [data-checkout-modal]"

      const address =
        selectedAddress();

        modal.querySelector(
          ".delyvo-checkout-address-v18"
        );

      if (!box) {
        box =
          document.createElement(
            "div"
          );

        box.className =
          "delyvo-checkout-address-v18";

        const first =
          modal.firstElementChild;

        if (first) {
          modal.insertBefore(
            box,
            first
          );
        } else {
          modal.appendChild(box);
        }

      if (address) {
        const name =
          address.recipient_name ||
          address.name ||
          "";

          address.phone ||

          address.address_line1 ||
          address.address ||
          "";

        const line2 =
          address.address_line2 ||
          "";

        const landmark =
          address.landmark ||

        const city =
          address.city ||
          "Modinagar";

        const pincode =
          address.pincode ||
          "201204";

        box.innerHTML = `
          <div class="delyvo-checkout-address-title-v18">
            Delivery Address

          <div class="delyvo-checkout-address-content-v18">
            <strong>${escapeHtml(name)}</strong>

            ${phone
              ? `<span>${escapeHtml(phone)}</span>`
              : ""}

            <span>
              ${escapeHtml(line1)}
              ${line2
                ? ", " + escapeHtml(line2)
                : ""}
            </span>

            ${landmark
              ? `<span>${escapeHtml(landmark)}</span>`
              : ""}

            <span>
              ${escapeHtml(city)}

            Change Address

            if (
              typeof window.openAddressManager ===
              "function"
            ) {
              window.openAddressManager();
            }
          };
        }

      const buttons =
        modal.querySelectorAll(
          "button"
        );

          String(

            "delyvo-address-action-v18"

        min-height: 42px;

        min-height: 42px;

      @media (max-width: 600px) {

        }

          min-height: 48px;
        }

    document.head.appendChild(

        init();

        if (document.body) {
